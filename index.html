function renderTickers(){
  if(state.activeTicker)return renderTickerDetail(state.activeTicker);

  const all=tickerArchive();
  if(!all.length){
    return `<div class="empty-state"><div class="empty-icon">🗂</div><div class="empty-title">Nothing tracked yet</div><div class="empty-body">Log an entry with a <code style="font-family:var(--font-mono);font-size:12px">$TICKER</code> or import a portfolio, and everything you touch will be archived here.</div></div>`;
  }

  const f=TICKER_FILTERS[state.tickerFilter]||TICKER_FILTERS.all;
  const s=TICKER_SORTS[state.tickerSort]||TICKER_SORTS.recent;
  const list=all.filter(f.test).sort(s.cmp);

  const counts={
    all:all.length,
    research:all.filter(TICKER_FILTERS.research.test).length,
    buy:all.filter(TICKER_FILTERS.buy.test).length,
    trim:all.filter(TICKER_FILTERS.trim.test).length,
    sell:all.filter(TICKER_FILTERS.sell.test).length,
    watch:all.filter(TICKER_FILTERS.watch.test).length,
    stale:all.filter(TICKER_FILTERS.stale.test).length,
    held:all.filter(TICKER_FILTERS.held.test).length,
    closed:all.filter(TICKER_FILTERS.closed.test).length,
    memo:all.filter(TICKER_FILTERS.memo.test).length,
    nomemo:all.filter(TICKER_FILTERS.nomemo.test).length,
  };

  // Stance filters only appear once a stance exists, so the row stays quiet
  // until the feature is actually in use.
  const stanceKeys=['research','buy','trim','sell','watch','stale'];
  const filterKeys=Object.keys(TICKER_FILTERS).filter(k=>!stanceKeys.includes(k)||counts[k]);
  const filters=`<div class="filter-chip-row" style="margin-bottom:8px">
    ${filterKeys.map(k=>`<div class="filter-chip ${state.tickerFilter===k?'active':''}" onclick="setTickerFilter('${k}')">${TICKER_FILTERS[k].label}${counts[k]?` ${counts[k]}`:''}</div>`).join('')}
  </div>`;

  const stray=findStrayTickers();
  const tidyBar=stray.total?`<div onclick="openTidyModal()" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;margin-bottom:10px;border-radius:var(--r);border:1px dashed var(--border2);background:var(--surface2);cursor:pointer">
    <span style="font-size:12px;color:var(--ink2)">${stray.total} stray ticker${stray.total===1?'':'s'} — from edited entries or empty tags</span>
    <span style="font-size:11px;font-family:var(--font-mono);color:var(--accent);white-space:nowrap">Review →</span>
  </div>`:'';

  const sorts=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
    <span class="section-label" style="margin:0">Sort</span>
    <div style="display:flex;gap:4px">
      ${Object.keys(TICKER_SORTS).map(k=>`<div class="filter-chip ${state.tickerSort===k?'active':''}" onclick="setTickerSort('${k}')">${TICKER_SORTS[k].label}</div>`).join('')}
    </div>
  </div>`;

  const rows=list.map(t=>{
    const statusPill = t.holding
      ? `<span style="font-family:var(--font-mono);font-size:10px;color:var(--accent)">${t.accountWeights.map(a=>`${(a.weight*100).toFixed(1)}%${t.accountWeights.length>1?' '+a.label.slice(0,3):''}`).join(' · ')}</span>`
      : (t.entries.length||t.memo)
        ? `<span style="font-family:var(--font-mono);font-size:10px;color:var(--ink3)">not held</span>`
        : `<span style="font-family:var(--font-mono);font-size:10px;color:var(--ink3)">—</span>`;

    const bits=[];
    if(t.entries.length)bits.push(`${t.entries.length} log${t.entries.length===1?'':'s'}`);
    if(t.memo)bits.push(`memo${t.memo.conviction?` ${t.memo.conviction}/5`:''}`);
    const meta=bits.length?bits.join(' · '):'nothing yet';

    const lastLine=t.entries.length?fmtDateRelative(t.entries[0].ts):'';

    return `<div class="ticker-row" onclick="openTicker('${t.symbol}')" style="align-items:center">
      <div style="min-width:0;flex:1">
        <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap">
          <span class="ticker-name">${t.symbol}</span>
          ${statusPill}
          ${stanceBadge(t.symbol)}
        </div>
        ${t.name?`<div style="font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.name}</div>`:''}
        <div style="font-size:10px;font-family:var(--font-mono);color:var(--ink3);margin-top:1px">${meta}</div>
      </div>
      ${lastLine?`<div style="font-size:10px;font-family:var(--font-mono);color:var(--ink3);flex-shrink:0;margin-left:10px">${lastLine}</div>`:''}
    </div>`;
  }).join('');

  const hashes=allHashes();
  const hashList=hashes.length?`<div class="section-label" style="margin-top:20px">Tags</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:60px">${hashes.map(([h,n])=>`<div class="tag hash" onclick="filterByHash('${h}')" style="padding:4px 12px;font-size:13px">${h} <span style="opacity:.6">${n}</span></div>`).join('')}</div>`:'<div style="margin-bottom:60px"></div>';

  return filters+tidyBar+sorts+`<div class="ticker-list">${rows}</div>`+hashList;
}

function renderTickerDetail(sym){
  const t=tickerArchive().find(x=>x.symbol===sym);
  if(!t){state.activeTicker=null;return renderTickers();}

  const tag=state.tickerTags[sym]||{};

  // Header
  const statusLine=t.holding
    ? `<span style="color:var(--accent)">${t.accountWeights.map(a=>`${(a.weight*100).toFixed(1)}% of ${a.label}`).join(' · ')}${t.legs.length?` <span style="color:var(--ink3)">(${t.legs.join(' · ')})</span>`:''}</span>`
    : (t.entries.length||t.memo)
      ? `<span style="color:var(--ink3)">not currently held</span>`
      : `<span style="color:var(--ink3)">no position</span>`;

  const tagLine=[tag.sector,tag.geography].filter(Boolean).join(' · ');

  const header=`<div style="margin-bottom:16px">
    <button class="back-btn" onclick="closeTicker()" style="margin-bottom:10px">← Tickers</button>
    <div style="font-family:var(--font-serif);font-size:26px">${t.symbol}</div>
    ${t.name?`<div style="font-size:13px;color:var(--ink3);font-family:var(--font-mono);margin-bottom:6px">${t.name}</div>`:''}
    <div style="display:flex;gap:10px;flex-wrap:wrap;font-family:var(--font-mono);font-size:11px">
      ${statusLine}
      ${tagLine?`<span style="color:var(--hash-txt)">${tagLine}</span>`:''}
    </div>
  </div>`;

  // Stance — one tap, set from the screen you're already on
  const stAge=stanceAgeDays(t.symbol);
  const stanceBlock=`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
      <div class="section-label" style="margin:0">Stance</div>
      ${stanceFor(t.symbol)?`<div style="font-size:10px;font-family:var(--font-mono);color:${stanceIsStale(t.symbol)?'var(--warn-txt)':'var(--ink3)'}">${stAge===0?'set today':'set '+stAge+'d ago'}${stanceIsStale(t.symbol)?' · worth a look':''}</div>`:`<div style="font-size:10px;font-family:var(--font-mono);color:var(--ink3)">optional</div>`}
    </div>
    ${stanceChips(t.symbol)}
  </div>`;

  // Actions — go where the depth is
  const actions=`<div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">
    ${t.memo
      ? `<button class="btn btn-ghost btn-sm" onclick="setTab('memos',{memoId:'${t.memo.id}'})">Open memo${t.memo.conviction?` · ${t.memo.conviction}/5`:''}</button>`
      : `<button class="btn btn-primary btn-sm" onclick="prefillNewMemo('${t.symbol}')">Write memo</button>`}
    <button class="btn btn-ghost btn-sm" onclick="composeForTicker('${t.symbol}')">+ Log entry</button>
  </div>`;

  // Memo summary, if one exists
  const memoBlock=t.memo&&t.memo.sections&&t.memo.sections.thesis
    ? `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px;margin-bottom:16px">
        <div class="section-label" style="margin-bottom:6px">Thesis</div>
        <div style="font-size:13px;line-height:1.6;color:var(--ink2)">${renderMd(t.memo.sections.thesis.slice(0,400))}${t.memo.sections.thesis.length>400?'…':''}</div>
      </div>`
    : '';

  // The archive itself — every log entry, newest first
  const logBlock=t.entries.length
    ? `<div class="section-label">History — ${t.entries.length} ${t.entries.length===1?'entry':'entries'}</div>
       <div style="margin-bottom:60px">
         ${t.entries.map(e=>`<div class="entry-card" style="margin-bottom:8px">
           <div class="entry-meta">
             <div class="entry-date">${fmtDate(e.ts)}</div>
             <div class="entry-actions">
               <button class="icon-btn" onclick="event.stopPropagation();editEntry('${e.id}')" title="Edit">✎</button>
             </div>
           </div>
           <div class="entry-body">${renderMd(e.text)}</div>
           ${e.hashes.length?`<div class="entry-tags">${e.hashes.map(h=>`<span class="tag hash" onclick="event.stopPropagation();filterByHash('${h}')">${h}</span>`).join('')}</div>`:''}
         </div>`).join('')}
       </div>`
    : `<div class="notice-box" style="margin-bottom:60px">No log entries for ${t.symbol} yet.</div>`;

  return header+stanceBlock+actions+memoBlock+logBlock;
}

    return connectBtn+`<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">${other.length?accountLabel(activeAccount())+' is empty':'No portfolio data'}</div><div class="empty-body">Paste your broker CSV export — exactly as downloaded, no editing needed.${other.length?'<br>Choose the account in the import box.':''}</div>${switchBack}</div>`;
  }

  const viewToggle=`<div style="display:flex;gap:4px;margin-bottom:14px">
    <div class="filter-chip ${state.portView!=='catalysts'?'active':''}" onclick="setPortView('holdings')">Holdings</div>
    <div class="filter-chip ${state.portView==='catalysts'?'active':''}" onclick="setPortView('catalysts')">Catalyst timeline</div>
  </div>`;

  // Account switcher — only once a second account has anything in it, so the
  // single-account case looks exactly as it did before.
  const accTabs=accountsInUse().length>1||ACCOUNTS.some(a=>accountIsPopulated(a.id)&&a.id!==DEFAULT_ACCOUNT)
    ? `<div style="display:flex;gap:6px;margin-bottom:12px">${ACCOUNTS.map(a=>{
        const on=activeAccount()===a.id;
        // Narrower type once a third account exists, so all three fit a phone.
        const many=ACCOUNTS.length>2;
        return `<div onclick="setAccount('${a.id}')" style="flex:1;min-width:0;text-align:center;cursor:pointer;padding:8px 4px;border-radius:var(--r);border:1px solid ${on?'var(--accent)':'var(--border2)'};background:${on?'var(--accent2)':'transparent'}">
          <div style="font-family:var(--font-serif);font-size:${many?'13px':'14px'};color:${on?'var(--accent)':'var(--ink2)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.label}</div>
          <div style="font-size:${many?'9px':'10px'};font-family:var(--font-mono);color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${accountIsPopulated(a.id)?accountRows(a.id).length+' holdings':'empty'}</div>
        </div>`;
      }).join('')}</div>`
    : '';

  if(state.portView==='catalysts')return connectBtn+accTabs+viewToggle+renderCatalystTimeline();

  // One row per company — a second listing adds to the weight, it does not
  // add a row. The individual lines stay visible in the `legs` label.
  const rows=portfolioGroups().map(g=>{
    const t=state.tickerTags[g.key]||{};
    return {...g,symbol:g.key,name:t.name||g.name||'',sector:t.sector||'',geography:t.geography||'',gfTicker:t.gfTicker||''};
  });

  // summary cards
  const meta=metaFor(activeAccount());
  const privacyToggle=(meta&&meta.totalValue)?`<div style="display:flex;justify-content:flex-end;margin-bottom:6px">
    <span onclick="toggleHideValues()" style="cursor:pointer;font-size:11px;font-family:var(--font-mono);color:var(--ink3);padding:3px 10px;border:1px solid var(--border2);border-radius:20px">${state.hideValues?'👁 Show values':'⊘ Hide values'}</span>
  </div>`:'';
  const summaryHtml=meta&&meta.totalValue?privacyToggle+`<div class="analytics-grid" style="margin-bottom:16px">
    <div class="metric-card"><div class="metric-label">${accountsInUse().length>1?accountLabel(activeAccount()):'Total portfolio'}</div><div class="metric-value" style="font-size:18px">${money(meta.totalValue)}</div></div>
    <div class="metric-card"><div class="metric-label">Invested</div><div class="metric-value" style="font-size:18px">${money(meta.investedValue||0)}</div></div>
    <div class="metric-card"><div class="metric-label">Cash</div><div class="metric-value" style="font-size:18px">${money(meta.cashGbp||0)}</div></div>
    <div class="metric-card"><div class="metric-label">Cash %</div><div class="metric-value" style="font-size:18px">${((meta.cashPct||0)*100).toFixed(1)}%</div></div>
  </div>`:'';

  // sector & geography aggregation from tags
  const sectors={};const geos={};let untaggedW=0;
  rows.forEach(h=>{
    const w=parseFloat(h.weight_pct||0);if(!w)return;
    if(h.sector)sectors[h.sector]=(sectors[h.sector]||0)+w;else untaggedW+=w;
    if(h.geography)geos[h.geography]=(geos[h.geography]||0)+w;
  });
  if(untaggedW>0)sectors['Untagged']=untaggedW;
  const sectorRows=Object.entries(sectors).sort((a,b)=>b[1]-a[1]);
  const geoRows=Object.entries(geos).sort((a,b)=>b[1]-a[1]);
  const maxSec=sectorRows[0]?.[1]||1;const maxGeo=geoRows[0]?.[1]||1;

  const secFilter=state.portSectorFilter;
  const geoFilter=state.portGeoFilter;

  const sectorHtml=sectorRows.map(([s,w])=>{
    const on=secFilter===s;
    const grey=s==='Untagged';
    return `<div class="ticker-row" onclick="togglePortSector('${jsAttr(s)}')" style="cursor:pointer;${on?'border-color:var(--hash-txt);background:var(--hash-bg);':''}">
      <div class="ticker-name" style="color:${grey?'var(--ink3)':'var(--hash-txt)'};min-width:80px">${on?'✓ ':''}${htmlText(s)}</div>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(w/maxSec*100)}%;background:${grey?'var(--ink3)':'var(--hash-txt)'}"></div></div>
      <div class="ticker-count">${(w*100).toFixed(1)}%</div>
    </div>`;
  }).join('');

  const geoHtml=geoRows.map(([g,w])=>{
    const on=geoFilter===g;
    return `<div class="ticker-row" onclick="togglePortGeo('${jsAttr(g)}')" style="cursor:pointer;${on?'border-color:var(--accent);background:var(--accent2);':''}">
      <div class="ticker-name" style="min-width:80px">${on?'✓ ':''}${htmlText(g)}</div>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(w/maxGeo*100)}%"></div></div>
      <div class="ticker-count">${(w*100).toFixed(1)}%</div>
    </div>`;
  }).join('');
  const geoSection=geoRows.length?`<div class="section-label">Geography</div><div class="ticker-list" style="margin-bottom:16px">${geoHtml}</div>`:'';

  // selection mode toolbar
  const selMode=state.portSelectMode;
  const selCount=Object.keys(state.portSelected).length;
  const untaggedCount=rows.filter(h=>!h.sector&&!h.geography).length;
  const tagToolbar=selMode
    ?`<div style="display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap">
        <span style="font-size:12px;font-family:var(--font-mono);color:var(--accent)">${selCount} selected</span>
        <button class="btn btn-ghost btn-sm" onclick="selectUntaggedHoldings()">Select untagged (${untaggedCount})</button>
        <button class="btn btn-primary btn-sm" ${selCount?'':'disabled'} onclick="openTagModal()">Tag selected</button>
        <button class="btn btn-ghost btn-sm" onclick="exitSelectMode()">Done</button>
      </div>`
    :`<div style="display:flex;gap:6px;margin-bottom:12px">
        <button class="btn btn-ghost btn-sm" onclick="enterSelectMode()">⊞ Tag holdings${untaggedCount?` (${untaggedCount} untagged)`:''}</button>
      </div>`;

  // holdings list — filtered, then sorted by the chosen mode
  let shown=rows;
  if(secFilter) shown=shown.filter(h=>(h.sector||'Untagged')===secFilter);
  if(geoFilter) shown=shown.filter(h=>h.geography===geoFilter);

  const byWeight=(a,b)=>parseFloat(b.weight_pct||0)-parseFloat(a.weight_pct||0);
  let sorted;
  if(state.portSort==='catalyst'){
    // Holdings with a sooner catalyst first; those with none sink to the bottom
    // but keep their weight order among themselves.
    sorted=[...shown].sort((a,b)=>{
      const ca=nextCatalystFor(a.symbol), cb=nextCatalystFor(b.symbol);
      if(ca&&cb)return ca.start.localeCompare(cb.start)||byWeight(a,b);
      if(ca)return -1;
      if(cb)return 1;
      return byWeight(a,b);
    });
  }else{
    sorted=[...shown].sort(byWeight);
  }
  const maxW=Math.max(...sorted.map(h=>parseFloat(h.weight_pct||0)),0.0001);

  // A clear way back to everything
  const activeFilters=[secFilter,geoFilter].filter(Boolean);
  const filterBanner=activeFilters.length?`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;margin-bottom:10px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--border2)">
    <div style="font-size:12px;color:var(--ink2);min-width:0">
      Showing <strong>${sorted.length}</strong> of ${rows.length} —
      <span style="font-family:var(--font-mono);color:var(--hash-txt)">${activeFilters.join(' · ')}</span>
      <span style="font-family:var(--font-mono);color:var(--ink3)"> · ${(sorted.reduce((s,h)=>s+parseFloat(h.weight_pct||0),0)*100).toFixed(1)}%</span>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="clearPortFilters()" style="flex-shrink:0">See all</button>
  </div>`:'';

  const holdingsHtml=sorted.map(h=>{
    const wPct=(parseFloat(h.weight_pct||0)*100).toFixed(1);
    const isSel=!!state.portSelected[h.symbol];
    const tagLine=h.sector||h.geography
      ?`${h.sector}${h.sector&&h.geography?' · ':''}${h.geography}`
      :'<span style="color:var(--warn-txt)">untagged</span>';
    const clickAction=selMode?`togglePortSelect('${h.symbol}')`:`goToTicker('${h.symbol}')`;
    const cat=nextCatalystFor(h.symbol);
    const now=new Date();
    const catLine=cat
      ?`<div style="font-size:10px;font-family:var(--font-mono);color:${new Date(cat.end||cat.start)<now?'var(--warn-txt)':'var(--accent)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px">◆ ${cat.timing||fmtCatalystRange(cat.start,cat.end)}</div>`
      :'';
    const legLine=h.multi
      ? `<div style="font-size:10px;font-family:var(--font-mono);color:var(--tag-txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px">⑂ ${h.legs.join(' · ')}</div>`
      : '';
    const subLine=state.portSort==='catalyst'
      ? (catLine||`<div style="font-size:10px;font-family:var(--font-mono);color:var(--ink3)">no catalyst</div>`)
      : (legLine||`<div style="font-size:10px;font-family:var(--font-mono);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px">${tagLine}</div>`);
    return`<div class="ticker-row" onclick="${clickAction}" style="${isSel?'border-color:var(--accent);background:var(--accent2);':''}">
      ${selMode?`<div style="width:20px;height:20px;border-radius:5px;border:2px solid ${isSel?'var(--accent)':'var(--border2)'};background:${isSel?'var(--accent)':'transparent'};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;margin-right:8px;flex-shrink:0">${isSel?'✓':''}</div>`:''}
      <div style="min-width:52px;flex-shrink:0"><div class="ticker-name" style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">${h.symbol}${stanceBadge(h.symbol)}</div>${subLine}</div>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(parseFloat(h.weight_pct||0)/maxW*100)}%"></div></div>
      <div style="text-align:right;min-width:52px"><div class="ticker-count">${wPct}%</div></div>
    </div>`;
  }).join('');

  const sortToggle=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <span class="section-label" style="margin:0">Sort</span>
    <div style="display:flex;gap:4px">
      <div class="filter-chip ${state.portSort!=='catalyst'?'active':''}" onclick="setPortSort('weight')">Weight</div>
      <div class="filter-chip ${state.portSort==='catalyst'?'active':''}" onclick="setPortSort('catalyst')">Next catalyst</div>
    </div>
  </div>`;

  return connectBtn+accTabs+viewToggle+syncInfo+summaryHtml+
    `<div class="section-label">Sector</div><div class="ticker-list" style="margin-bottom:16px">${sectorHtml}</div>`+
    geoSection+
    `<div class="section-label">Holdings (${sorted.length}${activeFilters.length?` of ${rows.length}`:''}${p.length>rows.length?` · ${p.length} listings`:''}) — by ${state.portSort==='catalyst'?'next catalyst':'weight'}</div>`+
    filterBanner+
    sortToggle+
    tagToolbar+
    `<div class="ticker-list" style="margin-bottom:60px">${holdingsHtml}</div>`;
}

/* ── selection & tagging ── */
function setPortView(v){state.portView=v;save();render();}
function setPortSort(s){state.portSort=s;save();render();}

/* The soonest pending catalyst for a holding — used to annotate and sort the
   holdings list. Returns {start,end,timing,text} or null. */
function nextCatalystFor(symbol){
  const memo=state.memos.find(m=>sameCompany(m.ticker,symbol));
  if(!memo||!memo.catalysts)return null;
  const pending=memo.catalysts
    .filter(c=>!c.done&&c.start)
    .sort((a,b)=>a.start.localeCompare(b.start));
  return pending.length?pending[0]:null;
}

/* Every catalyst across every memo, placed on a time axis and grouped by
   the period it falls in. This is the "what is my portfolio waiting on"
   view the catalyst timing was built for. */
function renderCatalystTimeline(){
  const all=[];
  state.memos.forEach(m=>{
    (m.catalysts||[]).forEach(cat=>{
      if(cat.done)return;
      all.push({
        ticker:m.ticker.replace(/^\$/,''),
        weight:weightFor(m.ticker,activeAccount())||weightFor(m.ticker,'all'),
        text:cat.text, timing:cat.timing, start:cat.start, end:cat.end,
      });
    });
  });

  if(!all.length){
    return `<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">No catalysts yet</div><div class="empty-body">Add expected events with timing inside your memos' Catalysts section, and they'll line up here by date.</div></div>`;
  }

  const dated=all.filter(c=>c.start).sort((a,b)=>a.start.localeCompare(b.start));
  const undated=all.filter(c=>!c.start);

  // Group by the quarter the catalyst STARTS in — so a Q3–Q4 event shows up
  // under Q3, when you'd first start watching for it.
  const groups={};
  dated.forEach(c=>{
    const d=new Date(c.start);
    const q=Math.floor(d.getMonth()/3)+1;
    const key=`Q${q} ${d.getFullYear()}`;
    (groups[key]=groups[key]||[]).push(c);
  });

  const now=new Date();
  const groupHtml=Object.entries(groups).map(([period,items])=>{
    const anyOverdue=items.some(c=>new Date(c.end||c.start)<now);
    const rows=items.sort((a,b)=>a.start.localeCompare(b.start)||b.weight-a.weight).map(c=>{
      const overdue=new Date(c.end||c.start)<now;
      const range=fmtCatalystRange(c.start,c.end);
      return `<div class="ticker-row" onclick="goToTicker('${c.ticker}')" style="align-items:flex-start">
        <div style="min-width:52px;flex-shrink:0">
          <div class="ticker-name">${c.ticker}</div>
          <div style="font-size:10px;font-family:var(--font-mono);color:var(--ink3)">${c.weight?(c.weight*100).toFixed(1)+'%':''}</div>
        </div>
        <div style="flex:1;min-width:0;margin-left:4px">
          <div style="font-size:13px;line-height:1.4;color:var(--ink)">${c.text}</div>
          <div style="font-family:var(--font-mono);font-size:10px;color:${overdue?'var(--warn-txt)':'var(--ink3)'};margin-top:2px">${c.timing||range}${c.timing&&range&&range!==c.timing?` · ${range}`:''}${overdue?' · overdue':''}</div>
        </div>
      </div>`;
    }).join('');
    return `<div class="section-label" style="margin-top:14px;color:${anyOverdue?'var(--warn-txt)':'var(--accent)'}">${period}</div>
      <div class="ticker-list">${rows}</div>`;
  }).join('');

  const undatedHtml=undated.length?`<div class="section-label" style="margin-top:14px;color:var(--ink3)">No timing set</div>
    <div class="ticker-list" style="margin-bottom:60px">${undated.map(c=>`<div class="ticker-row" onclick="goToTicker('${c.ticker}')">
      <div style="min-width:52px;flex-shrink:0"><div class="ticker-name">${c.ticker}</div></div>
      <div style="flex:1;margin-left:4px;font-size:13px;color:var(--ink)">${c.text}${c.timing?` <span style="font-family:var(--font-mono);font-size:10px;color:var(--ink3)">(${c.timing})</span>`:''}</div>
    </div>`).join('')}</div>`:'<div style="margin-bottom:60px"></div>';

  const summary=`<div style="font-size:11px;font-family:var(--font-mono);color:var(--ink3);text-align:center;margin-bottom:6px">${dated.length} upcoming · ${undated.length} undated</div>`;

  return summary+groupHtml+undatedHtml;
}

/* Tapping a sector or geography row filters the holdings below.
   Tapping the same one again clears it. */
function togglePortSector(s){
  state.portSectorFilter = state.portSectorFilter===s ? null : s;
  state.portSelected={};        // a stale selection under a new filter is confusing
  render();
}
function togglePortGeo(g){
  state.portGeoFilter = state.portGeoFilter===g ? null : g;
  state.portSelected={};
  render();
}
function clearPortFilters(){
  state.portSectorFilter=null;
  state.portGeoFilter=null;
  render();
}

function enterSelectMode(){state.portSelectMode=true;state.portSelected={};render();}
function exitSelectMode(){state.portSelectMode=false;state.portSelected={};render();}
function togglePortSelect(sym){
  if(state.portSelected[sym])delete state.portSelected[sym];
  else state.portSelected[sym]=true;
  render();
}
function selectUntaggedHoldings(){
  portfolioGroups().forEach(h=>{
    const t=state.tickerTags[h.key]||{};
    if(t.sector||t.geography)return;
    // Don't select rows the current filter has hidden
    if(state.portSectorFilter&&state.portSectorFilter!=='Untagged')return;
    if(state.portGeoFilter)return;
    state.portSelected[h.key]=true;
  });
  render();
}
function allPortfolioSymbols(){
  const set=new Set();
  accountRows('all').forEach(h=>set.add(bareSym(h.symbol)));
  Object.keys(state.tickerTags).forEach(s=>set.add(bareSym(s)));
  return [...set].sort();
}
function allExistingTagValues(field){
  const vals=new Set();
  Object.values(state.tickerTags).forEach(t=>{if(t[field])vals.add(t[field]);});
  return[...vals].sort();
}
function openTagModal(){
  const syms=Object.keys(state.portSelected);
  if(!syms.length){showToast('Select holdings first');return;}
  const single=syms.length===1;
  const cur=single?(state.tickerTags[syms[0]]||{}):{};
  const secOpts=allExistingTagValues('sector').map(v=>`<option value="${v}">`).join('');
  const geoOpts=allExistingTagValues('geography').map(v=>`<option value="${v}">`).join('');
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><div class="modal-title">Tag ${single?syms[0]:syms.length+' holdings'}</div><button class="icon-btn" onclick="closeModal()">✕</button></div>
      <div style="font-size:12px;color:var(--ink3);margin-bottom:12px">Leave a field blank to keep existing values unchanged.</div>
      <div class="field-row">
        <div class="field-label">Sector</div>
        <input class="field-input" id="tagSectorInput" list="sectorList" placeholder="e.g. Gold Explorer" value="${single?(cur.sector||''):''}">
        <datalist id="sectorList">${secOpts}</datalist>
      </div>
      <div class="field-row">
        <div class="field-label">Geography</div>
        <input class="field-input" id="tagGeoInput" list="geoList" placeholder="e.g. Canada" value="${single?(cur.geography||''):''}">
        <datalist id="geoList">${geoOpts}</datalist>
      </div>
      ${single?`<div class="field-row">
        <div class="field-label">Company name <span style="opacity:.5">(override — defaults to broker name)</span></div>
        <input class="field-input" id="tagNameInput" placeholder="${(lookupCompanyName(syms[0])||'').replace(/"/g,'&quot;')}" value="${(cur.name||'').replace(/"/g,'&quot;')}">
      </div>
      <div class="field-row">
        <div class="field-label">Full legal name <span style="opacity:.5">(the full registered company name)</span></div>
        <input class="field-input" id="tagLegalInput" placeholder="e.g. Snowline Gold Corp." value="${(cur.legalName||'').replace(/"/g,'&quot;')}">
      </div>
      <div class="field-row">
        <div class="field-label">Google Finance ticker <span style="opacity:.5">(override — e.g. OTC listing)</span></div>
        <input class="field-input" id="tagGfInput" placeholder="e.g. OTCMKTS:AUMBF" value="${cur.gfTicker||''}" style="font-family:var(--font-mono)">
      </div>
      <div class="field-row">
        <div class="field-label">Same company as <span style="opacity:.5">(a second symbol for one company — e.g. USA → USAS)</span></div>
        <input class="field-input" id="tagSameAsInput" list="symbolList" placeholder="leave blank if independent" value="${cur.sameAs||''}" style="font-family:var(--font-mono)">
        <datalist id="symbolList">${allPortfolioSymbols().filter(v=>v!==syms[0]).map(v=>`<option value="${v}">`).join('')}</datalist>
      </div>
      <div style="font-size:11px;font-family:var(--font-mono);color:var(--ink3);line-height:1.6;margin:-4px 0 10px">
        Weight, memo and catalysts merge under the other symbol. Nothing is rewritten — clear this field to separate them again.
      </div>`:''}
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="applyTags()">Apply</button>
      </div>
    </div>
  </div>`;
  setTimeout(()=>document.getElementById('tagSectorInput')?.focus(),100);
}
function applyTags(){
  const syms=Object.keys(state.portSelected);
  const sector=(document.getElementById('tagSectorInput')?.value||'').trim();
  const geo=(document.getElementById('tagGeoInput')?.value||'').trim();
  const gf=(document.getElementById('tagGfInput')?.value||'').trim();
  const nameOverride=(document.getElementById('tagNameInput')?.value||'').trim();
  const legalName=(document.getElementById('tagLegalInput')?.value||'').trim();
  const sameAsRaw=document.getElementById('tagSameAsInput')?.value;
  const sameAs=bareSym(sameAsRaw);
  if(syms.length===1&&sameAsRaw!==undefined&&sameAs){
    if(sameAs===bareSym(syms[0])){showToast('A company cannot be linked to itself');return;}
    const onward=bareSym((state.tickerTags[sameAs]||{}).sameAs);
    if(onward&&onward!==bareSym(syms[0])){
      showToast(sameAs+' already points at '+onward+' — link to '+onward+' instead');return;
    }
  }
  syms.forEach(s=>{
    const t=state.tickerTags[s]||{};
    if(sector)t.sector=sector;
    if(geo)t.geography=geo;
    if(syms.length===1){
      if(gf)t.gfTicker=gf;
      if(nameOverride)t.name=nameOverride;else delete t.name;
      if(legalName)t.legalName=legalName;else delete t.legalName;
      if(sameAsRaw!==undefined){ if(sameAs)t.sameAs=sameAs; else delete t.sameAs; }
    }
    state.tickerTags[s]=t;
  });
  save();closeModal();
  state.portSelected={};
  render();
  showToast('Tagged '+syms.length+' holding'+(syms.length===1?'':'s'));
  markDirty();
}

/* Two different symbols under an identical company name are almost always one
   company on two exchanges. Offered, never applied automatically — the match
   is exact on the normalised name, so it stays conservative. */
function findCompanyLinkSuggestions(){
  const byName={};
  accountRows('all').forEach(h=>{
    const n=String(h.name||'').toLowerCase().replace(/\s+/g,' ').trim();
    if(!n)return;
    const sym=bareSym(h.symbol);
    if(!byName[n])byName[n]=new Set();
    byName[n].add(sym);
  });
  const out=[];
  Object.entries(byName).forEach(([n,set])=>{
    const syms=[...set];
    if(syms.length<2)return;
    // already linked to each other? nothing to suggest
    const primaries=new Set(syms.map(primarySymbol));
    if(primaries.size<2)return;
    syms.sort((a,b)=>weightFor(b,'all')-weightFor(a,'all'));
    out.push({primary:syms[0],others:syms.slice(1),name:n});
  });
  return out;
}

/* Reading a file changes nothing about parsing — the text lands in the same
   textarea and goes through the same importer, so the file path cannot drift
   from the paste path. The only new risk is reading the wrong file or a file
   that isn't the export at all, so both are checked before anything is
   imported, and the text stays visible for you to see what was loaded. */
function loadCsvFile(ev){
  const file=ev&&ev.target&&ev.target.files&&ev.target.files[0];
  if(!file)return;
  const note=document.getElementById('csvFileNote');
  const say=(msg,colour)=>{if(note){note.textContent=msg;note.style.color=colour||'var(--ink3)';}};

  if(file.size>5*1024*1024){say('That file is over 5MB — is it the right one?','var(--danger)');ev.target.value='';return;}
  if(/\.(xlsx|xls|numbers|pdf|zip)$/i.test(file.name)){
    say('That looks like a spreadsheet, not a CSV. Export as CSV first.','var(--danger)');
    ev.target.value='';return;
  }
  say('Reading '+file.name+'…');
  const reader=new FileReader();
  reader.onerror=()=>{say('Could not read that file — try pasting instead','var(--danger)');ev.target.value='';};
  reader.onload=()=>{
    let text=String(reader.result||'').replace(/[\uFEFF\u200B\u200C\u200D]/g,'').trim();
    if(!text){say('That file is empty','var(--danger)');ev.target.value='';return;}
    // Binary sniff: a real CSV has no NUL bytes.
    if(text.indexOf('\u0000')>=0){say('That is not a text file — export as CSV','var(--danger)');ev.target.value='';return;}
    // Shape check: must look like the broker export before we accept it.
    const first=text.split(/\r?\n/).slice(0,6).join('\n').toLowerCase();
    if(!/symbol/.test(first)||!/(market value|price)/.test(first)){
      say('No Symbol/Price header found — is this the holdings export?','var(--danger)');
      // Still load it, so you can look at it and decide — but it is flagged.
    }else{
      say('Loaded '+file.name+' — check it below, then Import','var(--accent)');
    }
    const ta=document.getElementById('portfolioCsvInput');
    if(ta)ta.value=text;
  };
  reader.readAsText(file);
}

/* Emptying an account has to be deliberate: an import with no holdings is
   refused, because that is far more likely to be the wrong file than a real
   instruction to wipe a wrapper. This is the explicit route. */
function clearAccount(){
  const sel=document.getElementById('portfolioAccountSelect');
  const acct=ACCOUNTS.some(a=>a.id===(sel&&sel.value))?sel.value:activeAccount();
  const n=accountRows(acct).length;
  if(!n){showToast(accountLabel(acct)+' is already empty');return;}
  if(!confirm(`Remove all ${n} ${accountLabel(acct)} listings? Your memos, tags and stances are kept.`))return;
  state.portfolio=state.portfolio.filter(h=>(h.account||DEFAULT_ACCOUNT)!==acct);
  if(state.portfolioMeta)delete state.portfolioMeta[acct];
  const other=ACCOUNTS.find(a=>accountIsPopulated(a.id));
  state.activeAccount=other?other.id:DEFAULT_ACCOUNT;
  save();closeModal();render();markDirty();
  showToast(accountLabel(acct)+' cleared');
}

function detectDelimiter(text){
  // Look at the first few lines; whichever delimiter appears more consistently wins
  const sample=text.split(/\r?\n/).slice(0,5);
  let commas=0,tabs=0;
  sample.forEach(l=>{
    commas+=(l.match(/,/g)||[]).length;
    tabs+=(l.match(/\t/g)||[]).length;
  });
  return tabs>commas?'\t':',';
}

/* The broker prints the currency into the Price cell, and that is the only
   thing separating two listings of the same company: MNO is CA$1.70 on the
   TSX-V line and 90.80p on the AIM line. Across the whole export this is
   unambiguous — pence suffix, CA$, AU$, US$/$ and £ are the only forms. */
function detectListing(priceCell){
  const v=String(priceCell==null?'':priceCell).trim();
  if(!v)return{currency:'',listing:''};
  if(/^CA\$/i.test(v))   return{currency:'CAD',listing:'CA'};
  if(/^AU\$/i.test(v))   return{currency:'AUD',listing:'AU'};
  if(/^US\$/i.test(v))   return{currency:'USD',listing:'US'};
  if(/^£/.test(v))       return{currency:'GBP',listing:'UK'};
  if(/p$/i.test(v))      return{currency:'GBP',listing:'UK'};   // pence
  if(/^\$/.test(v))      return{currency:'USD',listing:'US'};
  return{currency:'',listing:''};
}

function parseCsvLine(line,delim){
  const d=delim||',';
  const parts=[];let cur='';let inQ=false;
  for(const ch of line){
    if(ch==='"'){inQ=!inQ;}
    else if(ch===d&&!inQ){parts.push(cur.trim());cur='';}
    else{cur+=ch;}
  }
  parts.push(cur.trim());
  return parts;
}

function importPortfolioCsv(){
  // Which account this CSV belongs to — read once, used for both the rows and
  // the meta, so the two can never disagree.
  const sel=document.getElementById('portfolioAccountSelect');
  const acct=ACCOUNTS.some(a=>a.id===(sel&&sel.value))?sel.value:activeAccount();
  let csv=(document.getElementById('portfolioCsvInput')?.value||'');
  // strip BOM / zero-width chars that the broker export scatters around
  csv=csv.replace(/[\uFEFF\u200B\u200C\u200D]/g,'').trim();
  if(!csv){showToast('Paste your broker CSV first');return;}
  const totalVal=parseFloat(document.getElementById('portfolioTotalInput')?.value||'0')||0;

  const delim=detectDelimiter(csv);
  const lines=csv.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows=lines.map(l=>parseCsvLine(l,delim));

  // locate header row (Symbol,Name,...) and the Market Value £ column
  let headerIdx=rows.findIndex(r=>(r[0]||'').toLowerCase()==='symbol');
  let mvCol=6;     // default position of "Market Value £" in the broker export
  let priceCol=3;  // default position of "Price" — carries the currency
  if(headerIdx>=0){
    const hdr=rows[headerIdx].map(c=>c.toLowerCase().trim());
    const found=hdr.findIndex(c=>c.includes('market value £')||c.includes('market value gbp'));
    if(found>=0)mvCol=found;
    // exact match, so "Average Price" further along doesn't win
    const pFound=hdr.findIndex(c=>c==='price');
    if(pFound>=0)priceCol=pFound;
  }
  const dataRows=headerIdx>=0?rows.slice(headerIdx+1):rows;

  // Currency codes appear in the broker's totals block, never as holdings
  const CURRENCY_CODES=new Set(['GBP','USD','CAD','AUD','EUR','CHF','JPY','NZD','HKD','SEK','NOK','DKK','SGD','ZAR','TOTALS','TOTAL']);
  const holdings=[];
  const seen=new Set();
  for(const r of dataRows){
    const sym=(r[0]||'').replace(/"/g,'').trim().toUpperCase();
    if(!sym)continue;                             // totals rows have an empty symbol
    if(CURRENCY_CODES.has(sym))continue;          // skip the totals-by-currency block
    if(!/^[A-Z0-9.]{1,10}$/.test(sym))continue;   // reject phantom rows from stray delimiters
    const name=(r[1]||'').trim();
    const mv=parseMV(r[mvCol]||'');
    if(!(mv>0))continue;                          // holdings have a positive market value
    const {currency,listing}=detectListing(r[priceCol]||'');
    /* Two lines can legitimately share a symbol — the same company on two
       exchanges. They differ by currency, and by value even if the broker
       ever prints two lines in one currency. A genuinely repeated row matches
       on all three and is still dropped. */
    const key=sym+':'+currency+':'+mv.toFixed(2);
    if(seen.has(key))continue;
    seen.add(key);
    holdings.push({symbol:sym,name,mv,currency,listing});
  }
  if(!holdings.length){showToast('No holdings found — check the paste');return;}

  // Sanity check: symbols should be short alphanumeric codes.
  // If most "symbols" look like numbers or long strings, the delimiter was wrong.
  const looksValid=holdings.filter(h=>/^[A-Z0-9.]{1,10}$/.test(h.symbol)).length;
  if(looksValid < holdings.length*0.7){
    showToast('Parse failed — open the CSV in Notepad and copy from there, not Excel');
    return;
  }

  const investedTotal=holdings.reduce((s,h)=>s+h.mv,0);
  const denom=totalVal>0?totalVal:investedTotal;

  /* ── The critical guard ──────────────────────────────────────────────
     An import replaces the rows of ONE account and leaves the other
     untouched. Importing Gilgamesh must never remove Odyssey — that is the
     operation done most often, so the danger is highest there. Rows are
     rebuilt for `acct` only and concatenated with everything else. */
  const kept=state.portfolio.filter(h=>(h.account||DEFAULT_ACCOUNT)!==acct);
  const fresh=holdings.map(h=>({
    symbol:h.symbol,
    name:h.name,
    currency:h.currency,
    listing:h.listing,
    account:acct,
    mv:h.mv,                          // value, not a frozen percentage
  }));
  state.portfolio=kept.concat(fresh);
  const cashVal=totalVal>0?Math.max(0,totalVal-investedTotal):0;
  if(!state.portfolioMeta||typeof state.portfolioMeta!=='object')state.portfolioMeta={};
  state.portfolioMeta[acct]={
    totalValue:    totalVal,
    investedValue: investedTotal,
    cashGbp:       cashVal,
    cashPct:       totalVal>0?cashVal/totalVal:0,
    snapshotDate:  new Date().toLocaleDateString('en-GB'),
  };
  state.portfolioSyncedAt=new Date().toISOString();
  state.activeAccount=acct;          // show what was just imported
  save();closeModal();render();
  const suggestions=findCompanyLinkSuggestions();
  if(suggestions.length){setTimeout(()=>{
    // Only if nothing else has been opened in the meantime — a delayed modal
    // must never overwrite one the user deliberately opened.
    const root=document.getElementById('modalRoot');
    if(root&&!root.innerHTML.trim())openLinkSuggestModal(suggestions);
  },400);}
  const newUntagged=portfolioGroups(acct).filter(g=>{const t=state.tickerTags[g.key]||{};return!t.sector&&!t.geography;}).length;
  showToast('Imported '+holdings.length+' holdings'+(newUntagged?' — '+newUntagged+' untagged':''));
  markDirty();
}

function parseWeight(val){
  // handles "3.25%" or "0.0325" from Sheets
  const s=String(val).replace(/[£%,\s]/g,'');
  const n=parseFloat(s);
  if(isNaN(n))return 0;
  return n>1?n/100:n; // if >1 assume it came as percentage string
}
function parseMV(val){
  const s=String(val).replace(/[£,\s]/g,'');
  const n=parseFloat(s);
  return isNaN(n)?0:n;
}

const OAUTH_REDIRECT = location.origin + location.pathname;
const OAUTH_SCOPES   = 'https://www.googleapis.com/auth/drive.file';

// Called on page load — complete the OAuth code exchange if we were redirected back
(async function handleOAuthRedirect(){
  const params = new URLSearchParams(location.search);
  const code       = params.get('code');
  const oauthState = params.get('state');   // CSRF token — NOT the app's state object
  if(!code || oauthState !== 'invest_diary_oauth') return;
  // Clean URL without reloading
  history.replaceState({}, '', location.pathname);
  const stored = JSON.parse(sessionStorage.getItem('oauth_pending')||'{}');
  if(!stored.clientId || !stored.clientSecret){showToast('OAuth error: credentials missing');return;}
  try{
    const res = await fetch('https://oauth2.googleapis.com/token',{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        code, client_id: stored.clientId, client_secret: stored.clientSecret,
        redirect_uri: OAUTH_REDIRECT, grant_type: 'authorization_code'
      })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error_description||data.error);
    state.oauthClientId     = stored.clientId;
    state.oauthClientSecret = stored.clientSecret;
    state.oauthRefreshToken = data.refresh_token;
    state.oauthAccessToken  = data.access_token;
    state.oauthExpiry       = Date.now() + (data.expires_in - 60) * 1000;
    state.driveSynced       = true;
    // share with Sheets
    state.sheetsToken = data.access_token;
    sessionStorage.removeItem('oauth_pending');
    syncError=false;
    save();
    refreshSyncBadge();
    showToast('Connected — syncing…');
    pushToDrive({manual:true});
  }catch(e){showToast('OAuth failed: '+e.message);}
})();

async function getAccessToken(){
  // Return cached token if still valid
  if(state.oauthAccessToken && Date.now() < state.oauthExpiry){
    return state.oauthAccessToken;
  }
  // Use refresh token to get a new access token silently
  if(!state.oauthRefreshToken || !state.oauthClientId || !state.oauthClientSecret){
    return null;
  }
  try{
    const res = await fetch('https://oauth2.googleapis.com/token',{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        refresh_token: state.oauthRefreshToken,
        client_id:     state.oauthClientId,
        client_secret: state.oauthClientSecret,
        grant_type:    'refresh_token'
      })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error_description||data.error);
    state.oauthAccessToken = data.access_token;
    state.oauthExpiry      = Date.now() + (data.expires_in - 60) * 1000;
    state.sheetsToken      = data.access_token;
    save();
    return data.access_token;
  }catch(e){
    syncError=true;
    refreshSyncBadge();
    return null;
  }
}

// A previously-saved tab may no longer exist
if(!['log','memos','portfolio','tickers'].includes(state.activeTab))state.activeTab='log';

let syncTimer;
let syncInFlight=false;   // a push or pull is actually on the wire right now
let syncError=false;      // last network/auth attempt failed (session-only)

// Called by every site that mutates diary data. Records WHEN the change happened
// (not when it was synced) so the conflict guard has an honest local clock.
function markDirty(){
  state.lastLocalChange=Date.now();
  state.dirty=true;
  save();
  refreshSyncBadge();
  if(state.oauthRefreshToken)scheduleDriveSync();
}
function scheduleDriveSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>pushToDrive({manual:false}),2000);}

function syncNow(){
  if(state.syncConflict){openSyncConflictModal(state.syncConflict);return;}
  openOAuthSetup();
}

// Compact for the badge: now / 4m / 3h / 2d
function relShort(ms){
  if(!ms)return '';
  const d=Date.now()-ms;
  if(d<60000)return 'now';
  if(d<3600000)return Math.floor(d/60000)+'m';
  if(d<86400000)return Math.floor(d/3600000)+'h';
  return Math.floor(d/86400000)+'d';
}
// Readable for modals and toasts
function relLong(ms){
  if(!ms)return 'never';
  const d=Date.now()-ms;
  if(d<60000)return 'just now';
  const m=Math.floor(d/60000);if(m<60)return m+(m===1?' minute ago':' minutes ago');
  const h=Math.floor(d/3600000);if(h<24)return h+(h===1?' hour ago':' hours ago');
  const dy=Math.floor(d/86400000);return dy+(dy===1?' day ago':' days ago');
}
function absTime(ms){
  if(!ms)return '—';
  const d=new Date(ms);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

function openOAuthSetup(){
  const root=document.getElementById('modalRoot');
  const isConnected = !!state.oauthRefreshToken;
  root.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">${isConnected?'Google account connected':'Connect Google account'}</div>
        <button class="icon-btn" onclick="closeModal()">✕</button>
      </div>
      <div style="font-size:11px;font-family:var(--font-mono);color:var(--ink3);margin-bottom:10px">Build · ${BUILD_STAMP}</div>
      ${isConnected
        ? `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;font-size:12px;font-family:var(--font-mono);color:var(--ink2);line-height:1.9;margin-bottom:12px">
             <div>Status · <span style="color:${syncStatusColour()}">${syncStatusLine()}</span></div>
             <div>Last synced · <span style="color:var(--ink)">${state.lastSyncedAt?absTime(state.lastSyncedAt)+' ('+relLong(state.lastSyncedAt)+')':'never from this device'}</span></div>
             <div>On this device · <span style="color:var(--ink)">${state.entries.length} entries, ${state.memos.length} memos</span></div>
           </div>
           <div style="font-size:11px;font-family:var(--font-mono);color:var(--ink3);line-height:1.6;margin-bottom:14px">
             drive.file scope only. Drive keeps 30 days of history for the backup file.
           </div>
           <div class="modal-footer" style="flex-wrap:wrap;gap:8px">
             <button class="btn btn-ghost" style="color:var(--danger);border-color:var(--danger)" onclick="disconnectOAuth()">Disconnect</button>
             <button class="btn btn-ghost" onclick="reAuthenticate()">Re-authenticate</button>
             <button class="btn btn-ghost" onclick="closeModal();restoreFromDrive()">Restore</button>
             <button class="btn btn-ghost" onclick="closeModal();checkDriveForNewer({silent:false})">Check Drive</button>
             <button class="btn btn-primary" onclick="closeModal();pushToDrive({manual:true})">Sync now</button>
           </div>`
        : `<div style="font-size:13px;color:var(--ink2);line-height:1.7;margin-bottom:14px">
            You'll need a <strong>Google Cloud OAuth 2.0 Client ID</strong>.<br>
            <a href="https://console.cloud.google.com/apis/credentials" target="_blank" style="color:var(--accent)">Open Google Cloud Console →</a>
           </div>
           <div class="field-row">
             <div class="field-label">Client ID</div>
             <input class="field-input" id="oauthClientId" placeholder="xxxx.apps.googleusercontent.com" value="${state.oauthClientId||''}">
           </div>
           <div class="field-row">
             <div class="field-label">Client Secret</div>
             <input class="field-input" id="oauthClientSecret" placeholder="GOCSPX-…" type="password" value="${state.oauthClientSecret||''}">
           </div>
           <div style="font-size:11px;font-family:var(--font-mono);color:var(--ink3);margin-bottom:12px;line-height:1.6">
             Authorised redirect URI to add in Cloud Console:<br>
             <span style="color:var(--ink)">${OAUTH_REDIRECT}</span>
           </div>
           <div class="modal-footer">
             <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
             <button class="btn btn-primary" onclick="startOAuthFlow()">Authorise with Google</button>
           </div>`
      }
    </div>
  </div>`;
}

function startOAuthFlow(){
  const clientId     = document.getElementById('oauthClientId')?.value?.trim();
  const clientSecret = document.getElementById('oauthClientSecret')?.value?.trim();
  if(!clientId||!clientSecret){showToast('Enter Client ID and Secret');return;}
  // Store credentials temporarily so the redirect handler can use them
  sessionStorage.setItem('oauth_pending', JSON.stringify({clientId, clientSecret}));
  const params = new URLSearchParams({
    client_id:     clientId,
    redirect_uri:  OAUTH_REDIRECT,
    response_type: 'code',
    scope:         OAUTH_SCOPES,
    access_type:   'offline',
    prompt:        'consent',   // force refresh_token even if previously granted
    state:         'invest_diary_oauth'
  });
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params;
}

function disconnectOAuth(){
  if(!confirm('Disconnect Google account? Diary entries stay local.'))return;
  state.oauthClientId=null;state.oauthClientSecret=null;
  state.oauthRefreshToken=null;state.oauthAccessToken=null;
  state.oauthExpiry=0;state.driveSynced=false;
  state.dirty=false;state.syncConflict=null;state.lastSyncedAt=null;state.lastSyncRemoteTime=null;state.lastSeenDriveModified=null;
  syncError=false;save();closeModal();refreshSyncBadge();showToast('Disconnected');
}
async function restoreFromDrive(){
  const hasLocal=state.entries.length||state.memos.length||Object.keys(state.tickerTags).length;
  const warn=state.dirty
    ? 'Restore from Drive? This device has unsaved changes that will be discarded.'
    : 'Restore from Drive? This replaces the data on this device with the Drive backup.';
  if(hasLocal&&!confirm(warn))return;
  state.syncConflict=null;save();
  await pullFromDrive({silent:false,force:true});
}

function reAuthenticate(){
  state.oauthRefreshToken=null;state.oauthAccessToken=null;
  state.oauthExpiry=0;state.driveSynced=false;
  save();closeModal();
  setTimeout(openOAuthSetup,100);
}

// The badge reports real state, in priority order. Nothing here guesses.
function computeSyncStatus(){
  if(!state.oauthRefreshToken)return 'disconnected';
  if(syncInFlight)return 'syncing';
  if(state.syncConflict)return 'conflict';
  if(syncError)return 'error';
  if(state.dirty)return 'dirty';
  return 'ok';
}
function refreshSyncBadge(){
  const status=computeSyncStatus();
  const badge=document.getElementById('syncBadge');
  const dot=document.getElementById('syncDot');
  const label=document.getElementById('syncLabel');
  if(!badge||!dot||!label)return;
  badge.className='sync-badge';dot.className='dot';
  if(status==='syncing'){
    badge.classList.add('syncing');dot.classList.add('pulse');label.textContent='Syncing…';
  }else if(status==='conflict'){
    badge.classList.add('conflict');dot.classList.add('pulse');label.textContent='Drive is newer';
  }else if(status==='error'){
    badge.classList.add('error');label.textContent='Sync error';
  }else if(status==='dirty'){
    badge.classList.add('dirty');label.textContent='Unsaved';
  }else if(status==='ok'){
    badge.classList.add('syncing');
    label.textContent=state.lastSyncedAt?('Synced · '+relShort(state.lastSyncedAt)):'Synced';
  }else{
    label.textContent='Connect Drive';
  }
  badge.title=syncTooltip(status);
}
function syncTooltip(status){
  if(status==='disconnected')return 'Tap to connect a Google account';
  if(status==='syncing')return 'Talking to Drive…';
  if(status==='conflict')return 'Another device saved a newer copy — tap to choose which one to keep';
  if(status==='error')return 'Last sync attempt failed — tap for options';
  if(status==='dirty')return 'Changes on this device are not in Drive yet';
  return 'Last synced from this device '+relLong(state.lastSyncedAt);
}
// Keep the relative timestamp honest without re-rendering the app
setInterval(refreshSyncBadge,30000);
function syncStatusLine(){
  const st=computeSyncStatus();
  if(st==='syncing')return 'syncing now';
  if(st==='conflict')return 'two versions — needs a decision';
  if(st==='error')return 'last attempt failed';
  if(st==='dirty')return 'unsaved changes on this device';
  if(st==='disconnected')return 'not connected';
  return 'up to date';
}
function syncStatusColour(){
  const st=computeSyncStatus();
  if(st==='conflict'||st==='error')return 'var(--danger)';
  if(st==='dirty')return 'var(--warn-txt)';
  return 'var(--accent)';
}

async function findDriveFile(token){
  if(state.driveFileId)return state.driveFileId;
  const res=await fetch(`https://www.googleapis.com/drive/v3/files?q=name%3D'investment-diary.json'+and+trashed%3Dfalse&fields=files(id,name,modifiedTime)`,{headers:{Authorization:`Bearer ${token}`}});
  const data=await res.json();
  if(data.files&&data.files.length){
    state.driveFileId=data.files[0].id;
    save();
    return state.driveFileId;
  }
  return null;
}

// Cheap metadata-only read. modifiedTime tells us whether Drive moved since we
// last looked; version lets us spot a write that landed inside our upload window.
async function driveMeta(token,fileId){
  try{
    const res=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=id,modifiedTime,version`,{headers:{Authorization:`Bearer ${token}`}});
    if(!res.ok)return null;
    const m=await res.json();
    return m&&m.modifiedTime?m:null;
  }catch(e){return null;}
}

/* ── Pull ─────────────────────────────────────────────────────────────── */
async function pullFromDrive(opts){
  opts=opts||{};
  const silent=!!opts.silent, force=!!opts.force;
  const token=await getAccessToken();
  if(!token){if(!silent)showToast('Not connected to Drive');return false;}
  syncInFlight=true;refreshSyncBadge();
  try{
    const fileId=await findDriveFile(token);
    if(!fileId){if(!silent)showToast('No backup found in Drive');return false;}
    const meta=await driveMeta(token,fileId);
    const res=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,{headers:{Authorization:`Bearer ${token}`}});
    if(!res.ok)throw new Error('Could not read the Drive backup');
    const remote=await res.json();
    if(!remote||typeof remote!=='object'||!Array.isArray(remote.entries))throw new Error('Drive backup is not readable');

    const remoteTime=remote.lastSync?new Date(remote.lastSync).getTime():0;
    const seenTime=state.lastSyncRemoteTime?new Date(state.lastSyncRemoteTime).getTime():0;
    const localEmpty=!state.entries.length&&!state.memos.length&&!Object.keys(state.tickerTags).length;

    // Nothing to gain: we have already seen this Drive copy and we hold data.
    if(!force&&!localEmpty&&remoteTime<=seenTime){
      // Still record the metadata we just observed so the guard stays calibrated.
      if(meta){state.lastSeenDriveModified=meta.modifiedTime;save();}
      if(!silent)showToast('This device is already up to date');
      return false;
    }

    state.entries=remote.entries||[];
    state.memos=remote.memos||[];
    state.tickerTags=remote.tickerTags||{};
    if(remote.portfolio)state.portfolio=remote.portfolio;
    if(remote.portfolioMeta)state.portfolioMeta=remote.portfolioMeta;
    migratePortfolioToAccounts();   // a device on an older build may send legacy rows
    if(remote.portfolioSyncedAt)state.portfolioSyncedAt=remote.portfolioSyncedAt;

    state.lastSyncRemoteTime=remote.lastSync||null;
    state.lastSeenDriveModified=meta?meta.modifiedTime:state.lastSeenDriveModified;
    state.lastSyncedAt=Date.now();
    state.lastLocalChange=remoteTime;
    state.dirty=false;
    state.syncConflict=null;
    syncError=false;
    save();render();
    showToast('Took Drive\u2019s copy — '+state.entries.length+' entries, '+state.memos.length+' memos');
    return true;
  }catch(e){
    syncError=true;
    if(!silent)showToast('Could not read Drive: '+e.message);
    return false;
  }finally{
    syncInFlight=false;refreshSyncBadge();
  }
}

/* ── Push ─────────────────────────────────────────────────────────────── */
async function pushToDrive(opts){
  opts=opts||{};
  const manual=!!opts.manual, force=!!opts.force;
  if(syncInFlight)return false;   // never let two writes overlap from one device
  const token=await getAccessToken();
  if(!token){
    if(state.oauthRefreshToken){syncError=true;refreshSyncBadge();}
    return false;
  }
  // Safety: never let an empty device overwrite a Drive backup that has data.
  const localEmpty=!state.entries.length&&!state.memos.length&&!Object.keys(state.tickerTags).length;
  if(localEmpty){
    try{
      const fid=await findDriveFile(token);
      if(fid){
        const chk=await fetch(`https://www.googleapis.com/drive/v3/files/${fid}?alt=media`,{headers:{Authorization:`Bearer ${token}`}});
        if(chk.ok){
          const rem=await chk.json();
          const remoteHasData=(rem.entries&&rem.entries.length)||(rem.memos&&rem.memos.length)||(rem.tickerTags&&Object.keys(rem.tickerTags).length);
          if(remoteHasData){
            syncError=false;refreshSyncBadge();
            showToast('Drive has data this device does not — use Restore, not Sync');
            return false;
          }
        }
      }
    }catch(e){/* if the check fails, fall through to a normal sync */}
  }

  syncInFlight=true;refreshSyncBadge();
  let preVersion=null;
  try{
    let fileId=state.driveFileId||await findDriveFile(token);

    /* Conflict guard — refuse to flatten a copy we have not seen.
       Runs immediately before the write, so it also catches the case where
       another device pushed while this one had the app open. */
    if(fileId){
      const meta=await driveMeta(token,fileId);
      if(meta){
        preVersion=Number(meta.version)||null;
        if(!force&&state.lastSeenDriveModified&&meta.modifiedTime!==state.lastSeenDriveModified){
          state.syncConflict={
            remoteModified:meta.modifiedTime,
            detectedAt:Date.now(),
            origin:'push'
          };
          save();
          syncInFlight=false;refreshSyncBadge();
          if(manual)openSyncConflictModal(state.syncConflict);
          else showToast('Drive has a newer copy — tap the badge to resolve');
          return false;
        }
      }
    }

    const now=new Date().toISOString();
    const data=JSON.stringify({
      entries:state.entries,memos:state.memos,tickerTags:state.tickerTags,
      portfolio:state.portfolio,portfolioMeta:state.portfolioMeta,portfolioSyncedAt:state.portfolioSyncedAt,
      lastSync:now
    },null,2);

    if(!fileId){
      const meta={name:'investment-diary.json',mimeType:'application/json'};
      const createRes=await fetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(meta)});
      const created=await createRes.json();
      if(!created.id)throw new Error('could not create the Drive file');
      fileId=created.id;
    }
    const put=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,{method:'PATCH',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:data});
    if(!put.ok)throw new Error('Drive rejected the upload');

    state.driveFileId=fileId;

    /* Read back. Two jobs: record the metadata the guard compares against next
       time, and notice a write that slipped in while ours was uploading —
       a version jump of more than one means somebody else also wrote. */
    const after=await driveMeta(token,fileId);
    if(after&&preVersion&&(Number(after.version)-preVersion)>1){
      state.syncConflict={
        remoteModified:after.modifiedTime,
        detectedAt:Date.now(),
        origin:'overlap'
      };
      state.lastSeenDriveModified=after.modifiedTime;
      save();
      syncInFlight=false;refreshSyncBadge();
      showToast('Another device wrote at the same time — tap the badge');
      return false;
    }

    state.lastSeenDriveModified=after?after.modifiedTime:state.lastSeenDriveModified;
    state.lastSyncRemoteTime=now;
    state.lastSyncedAt=Date.now();
    state.dirty=false;
    state.syncConflict=null;
    syncError=false;
    save();
    return true;
  }catch(err){
    syncError=true;
    showToast('Drive sync failed — changes are still saved on this device');
    return false;
  }finally{
    syncInFlight=false;refreshSyncBadge();
  }
}

/* ── Pull-on-open: does Drive hold something this device has not seen? ── */
async function checkDriveForNewer(opts){
  opts=opts||{};
  if(!state.oauthRefreshToken)return;
  if(syncInFlight)return;
  const token=await getAccessToken();
  if(!token)return;
  const fileId=await findDriveFile(token);
  if(!fileId)return;
  const meta=await driveMeta(token,fileId);
  if(!meta)return;
  // First run on this device: adopt the current metadata as the baseline.
  if(!state.lastSeenDriveModified){state.lastSeenDriveModified=meta.modifiedTime;save();return;}
  if(meta.modifiedTime===state.lastSeenDriveModified)return;
  state.syncConflict={remoteModified:meta.modifiedTime,detectedAt:Date.now(),origin:'open'};
  save();refreshSyncBadge();
  if(!opts.silent)openSyncConflictModal(state.syncConflict);
}

/* ── Resolution ───────────────────────────────────────────────────────── */
function openSyncConflictModal(info){
  info=info||state.syncConflict||{};
  const remoteWhen=info.remoteModified?new Date(info.remoteModified).getTime():null;
  const lead=info.origin==='overlap'
    ? 'Another device wrote to Drive at the same moment as this one, so this device\u2019s changes may not have landed.'
    : info.origin==='push'
      ? 'Drive holds a copy this device has not seen, so the sync was stopped before it could overwrite anything.'
      : 'Drive holds a copy this device has not seen.';
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Two versions</div>
        <button class="icon-btn" onclick="closeModal()">✕</button>
      </div>
      <div style="font-size:13px;color:var(--ink2);line-height:1.7;margin-bottom:12px">${lead}</div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;font-size:12px;font-family:var(--font-mono);color:var(--ink2);line-height:1.9;margin-bottom:12px">
        <div>Drive updated · <span style="color:var(--ink)">${remoteWhen?relLong(remoteWhen):'unknown'}</span></div>
        <div>This device last synced · <span style="color:var(--ink)">${relLong(state.lastSyncedAt)}</span></div>
        <div>This device · <span style="color:var(--ink)">${state.entries.length} entries, ${state.memos.length} memos${state.dirty?' · unsaved changes':''}</span></div>
      </div>
      <div style="font-size:11px;font-family:var(--font-mono);color:var(--ink3);line-height:1.6;margin-bottom:14px">
        Drive keeps 30 days of history, so whichever you pick the other is recoverable from the file\u2019s version history.
      </div>
      <div class="modal-footer" style="flex-wrap:wrap;gap:8px">
        <button class="btn btn-ghost" onclick="closeModal()">Decide later</button>
        <button class="btn btn-ghost" onclick="resolveConflict('local')">Keep this device\u2019s</button>
        <button class="btn btn-primary" onclick="resolveConflict('drive')">Take Drive\u2019s</button>
      </div>
    </div>
  </div>`;
}
async function resolveConflict(choice){
  closeModal();
  if(choice==='drive'){
    state.syncConflict=null;save();
    await pullFromDrive({force:true,silent:false});
  }else{
    state.syncConflict=null;save();
    const ok=await pushToDrive({manual:true,force:true});
    if(ok)showToast('Drive now matches this device');
  }
}

// Keep the batch countdown honest without re-rendering the whole app
function showBuild(){
  showToast('Build '+BUILD_STAMP);
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
render();
// Set initial sync badge state based on persisted OAuth
(async function initBadge(){
  if(!state)return;
  if(state.oauthRefreshToken){
    refreshSyncBadge();
    // Warm up the access token so the first real sync doesn't fail
    const t=await getAccessToken();
    syncError=!t;refreshSyncBadge();
    if(!t)return;
    // Empty device (new browser, cleared cache): take the backup without asking.
    const localEmpty=!state.entries.length&&!state.memos.length&&!Object.keys(state.tickerTags).length;
    if(localEmpty){await pullFromDrive({silent:true,force:true});return;}
    // Every other device: ask Drive whether it moved, and offer to take it.
    await checkDriveForNewer({silent:false});
    // A change made offline last session still needs to go up.
    if(state.dirty&&!state.syncConflict)scheduleDriveSync();
  }else if(state.driveSynced){
    state.driveSynced=false;state.driveToken=null;
    save();refreshSyncBadge();
  }
})();

// On a phone, "open" usually means "come back to". Re-check on resume, quietly:
// flag the badge rather than throwing a modal over whatever the user returned to.
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(!state.oauthRefreshToken||state.syncConflict||syncInFlight)return;
  checkDriveForNewer({silent:true});
});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js')
      .catch(e=>console.warn('SW registration failed:',e));
  });
}
</script>
</body>
</html>
