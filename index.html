<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a6b3c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="invest.diary">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>invest.diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#1a1a1a;--ink2:#4a4a4a;--ink3:#8a8a8a;--surface:#ffffff;--surface2:#f7f6f3;--surface3:#f0ede8;
    --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
    --accent:#1a6b3c;--accent2:#e8f5ee;--accent3:#c8e8d5;
    --tag-bg:#eef4ff;--tag-txt:#2255aa;--hash-bg:#fff8e8;--hash-txt:#a05800;
    --danger:#c0392b;--warn-bg:#fff3e0;--warn-txt:#b05000;
    --conviction-1:#e8f0ff;--conviction-1t:#3355bb;
    --conviction-2:#e8f5ee;--conviction-2t:#1a6b3c;
    --conviction-3:#fff8e0;--conviction-3t:#a07000;
    --conviction-4:#fff0e8;--conviction-4t:#b04000;
    --conviction-5:#fce8e8;--conviction-5t:#a01515;
    --r:10px;--r2:16px;--shadow:0 1px 4px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.04);
    --font-body:'Geist',sans-serif;--font-serif:'DM Serif Display',serif;--font-mono:'DM Mono',monospace;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --ink:#e8e6e0;--ink2:#aaa89f;--ink3:#66645e;--surface:#1c1b18;--surface2:#242320;--surface3:#2c2b27;
      --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
      --accent:#4cae7a;--accent2:#0f2a1a;--accent3:#1a4030;
      --tag-bg:#1a2240;--tag-txt:#7aaaf0;--hash-bg:#2a2010;--hash-txt:#e09020;
      --conviction-1:#1a2240;--conviction-1t:#7aaaf0;
      --conviction-2:#0f2a1a;--conviction-2t:#4cae7a;
      --conviction-3:#2a2010;--conviction-3t:#e09020;
      --conviction-4:#2a1a10;--conviction-4t:#e07040;
      --conviction-5:#2a1010;--conviction-5t:#e05050;
      --shadow:0 1px 4px rgba(0,0,0,0.3),0 4px 16px rgba(0,0,0,0.2);
    }
  }
  body{font-family:var(--font-body);background:var(--surface2);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  #app{display:flex;flex-direction:column;max-width:480px;margin:0 auto;min-height:100vh;background:var(--surface);position:relative;width:100%}
  #shell{display:flex;justify-content:center;align-items:flex-start;gap:0}
  #contextRail{display:none}
  /* Wide screens: the log stays a single readable column — a diary is read in
     order, and columns would send you back up the page. The extra width goes
     to context that used to be collapsed: views, stances, memos to write. */
  @media(min-width:1080px){
    #shell{gap:24px;padding:0 24px}
    #app{margin:0;border-right:1px solid var(--border)}
    #contextRail{display:block;width:320px;flex-shrink:0;position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:18px 0 40px}
    .fab{right:max(16px,calc(50% - 402px))}
  }
  /* Grids can take the extra width safely — order matters less there. */
  @media(min-width:1080px){
    #app.wide{max-width:760px}
    #app.wide .ticker-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    #app.wide .analytics-grid{grid-template-columns:repeat(4,1fr)}
  }
  .rail-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px;margin-bottom:12px}
  .rail-title{font-family:var(--font-serif);font-size:14px;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .rail-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--border);cursor:pointer}
  .rail-row:first-of-type{border-top:none}
  .rail-empty{font-size:12px;color:var(--ink3);line-height:1.5}
  .topbar{padding:14px 16px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:100;display:flex;flex-direction:column;gap:8px}
  .topbar-row{display:flex;align-items:center;justify-content:space-between}
  .brand{font-family:var(--font-serif);font-size:20px;color:var(--ink);letter-spacing:-0.3px}
  .brand span{color:var(--accent)}
  .sync-badge{font-size:11px;font-family:var(--font-mono);padding:3px 8px;border-radius:20px;border:1px solid var(--border2);color:var(--ink3);cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .2s}
  .sync-badge:hover{border-color:var(--accent);color:var(--accent)}
  .sync-badge.syncing{color:var(--accent);border-color:var(--accent3)}
  .sync-badge.error{color:var(--danger);border-color:var(--danger)}
  .sync-badge.dirty{color:var(--warn-txt);border-color:var(--warn-txt)}
  .sync-badge.conflict{color:var(--danger);border-color:var(--danger);background:var(--warn-bg)}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
  .dot.pulse{animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .search-bar{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:var(--r);padding:0 10px;border:1px solid var(--border)}
  .search-bar input{flex:1;background:transparent;border:none;outline:none;font-size:14px;font-family:var(--font-body);color:var(--ink);padding:8px 0}
  .search-bar input::placeholder{color:var(--ink3)}
  .search-icon{font-size:14px;color:var(--ink3)}
  .tabs{display:flex;padding:0 16px;border-bottom:1px solid var(--border);gap:0;background:var(--surface);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:10px 14px;font-size:13px;font-weight:500;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .scroll-area{flex:1;overflow-y:auto;padding:16px}
  .compose-card{background:var(--surface);border-radius:var(--r2);border:1px solid var(--border2);padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
  .compose-label{font-size:11px;font-family:var(--font-mono);color:var(--ink3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
  .compose-area{width:100%;min-height:80px;border:none;outline:none;font-size:15px;font-family:var(--font-body);color:var(--ink);background:transparent;resize:none;line-height:1.6}
  .compose-area::placeholder{color:var(--ink3)}
  .compose-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
  .preview-tags{display:flex;flex-wrap:wrap;gap:4px;flex:1}
  .tag{font-size:12px;font-family:var(--font-mono);padding:2px 8px;border-radius:20px;cursor:pointer;transition:opacity .15s}
  .tag:hover{opacity:.75}
  .tag.ticker{background:var(--tag-bg);color:var(--tag-txt)}
  .tag.hash{background:var(--hash-bg);color:var(--hash-txt)}
  .btn{padding:7px 14px;border-radius:var(--r);border:none;cursor:pointer;font-size:13px;font-family:var(--font-body);font-weight:500;transition:all .15s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{opacity:.88}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed}
  .btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--ink2)}
  .btn-ghost:hover{background:var(--surface2)}
  .btn-sm{padding:5px 10px;font-size:12px}
  .entry-card{background:var(--surface);border-radius:var(--r2);border:1px solid var(--border);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);transition:box-shadow .2s}
  .entry-card:hover{box-shadow:0 2px 8px rgba(0,0,0,0.09),0 6px 24px rgba(0,0,0,0.06)}
  .entry-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .entry-date{font-size:11px;font-family:var(--font-mono);color:var(--ink3)}
  .entry-actions{display:flex;gap:6px}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink3);font-size:14px;padding:2px 4px;border-radius:4px;transition:color .15s}
  .icon-btn:hover{color:var(--ink)}
  .entry-body{font-size:14px;line-height:1.65;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
  .entry-body strong{font-weight:500;color:var(--ink)}
  .entry-body em{font-style:italic}
  .entry-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
  .notice-box{padding:8px;background:var(--warn-bg);border-radius:var(--r);font-size:12px;color:var(--warn-txt);line-height:1.5}
  .empty-state{text-align:center;padding:48px 24px;color:var(--ink3)}
  .empty-icon{font-size:36px;margin-bottom:12px;opacity:.4}
  .empty-title{font-family:var(--font-serif);font-size:18px;color:var(--ink2);margin-bottom:6px}
  .empty-body{font-size:13px;line-height:1.6}
                              .analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .metric-card{background:var(--surface2);border-radius:var(--r);padding:12px;border:1px solid var(--border)}
  .metric-label{font-size:11px;font-family:var(--font-mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .metric-value{font-size:24px;font-weight:500;color:var(--ink);font-family:var(--font-serif)}
  .metric-sub{font-size:11px;color:var(--ink3);margin-top:2px}
  .ticker-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .ticker-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface);border-radius:var(--r);border:1px solid var(--border);cursor:pointer;transition:all .2s}
  .ticker-row:hover{border-color:var(--accent3);background:var(--accent2)}
  .ticker-name{font-family:var(--font-mono);font-weight:500;color:var(--tag-txt)}
  .ticker-count{font-size:12px;color:var(--ink3);font-family:var(--font-mono)}
  .bar-bg{flex:0 0 110px;width:110px;height:4px;background:var(--surface3);border-radius:2px;margin:0 10px 0 auto}
  .bar-fill{height:100%;border-radius:2px;background:var(--accent)}
  .ticker-row>.ticker-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .section-label{font-size:11px;font-family:var(--font-mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
  .weekly-digest-btn{width:100%;padding:12px;background:var(--accent2);border:1px dashed var(--accent3);border-radius:var(--r2);cursor:pointer;font-family:var(--font-mono);font-size:12px;color:var(--accent);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;margin-bottom:16px}
  .weekly-digest-btn:hover{background:var(--accent3)}
  .filter-chip-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
  .filter-chip{font-size:11px;font-family:var(--font-mono);padding:3px 10px;border-radius:20px;border:1px solid var(--border2);cursor:pointer;color:var(--ink2);transition:all .15s}
  .filter-chip.active{background:var(--tag-bg);color:var(--tag-txt);border-color:var(--tag-txt)}
  .filter-chip.hash-chip.active{background:var(--hash-bg);color:var(--hash-txt);border-color:var(--hash-txt)}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:flex;align-items:flex-end;justify-content:center}
  .modal{background:var(--surface);border-radius:var(--r2) var(--r2) 0 0;padding:20px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .modal-title{font-family:var(--font-serif);font-size:18px}
  .modal textarea{width:100%;min-height:100px;border:1px solid var(--border2);border-radius:var(--r);padding:10px;font-size:14px;font-family:var(--font-body);color:var(--ink);background:var(--surface2);outline:none;resize:vertical}
  .modal textarea:focus{border-color:var(--accent)}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);font-size:13px;font-family:var(--font-mono);padding:8px 16px;border-radius:20px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}
  .fab{position:fixed;bottom:20px;right:max(16px,calc(50% - 240px + 16px));width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:22px;box-shadow:0 4px 16px rgba(0,100,50,0.35);display:flex;align-items:center;justify-content:center;z-index:150;transition:all .2s}
  .fab:hover{transform:scale(1.07)}
  mark{background:rgba(255,200,50,.35);border-radius:2px}

  /* ── Memo styles ── */
  .memo-list{display:flex;flex-direction:column;gap:10px}
  .memo-card{background:var(--surface);border-radius:var(--r2);border:1px solid var(--border);padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .2s,border-color .2s}
  .memo-card:hover{box-shadow:0 2px 8px rgba(0,0,0,0.09),0 6px 24px rgba(0,0,0,0.06);border-color:var(--border2)}
  .memo-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
  .memo-ticker{font-family:var(--font-mono);font-size:16px;font-weight:500;color:var(--tag-txt)}
  .memo-name{font-size:13px;color:var(--ink2);margin-top:1px}
  .conviction-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-family:var(--font-mono);padding:3px 9px;border-radius:20px;font-weight:500;white-space:nowrap}
  .conviction-1{background:var(--conviction-1);color:var(--conviction-1t)}
  .conviction-2{background:var(--conviction-2);color:var(--conviction-2t)}
  .conviction-3{background:var(--conviction-3);color:var(--conviction-3t)}
  .conviction-4{background:var(--conviction-4);color:var(--conviction-4t)}
  .conviction-5{background:var(--conviction-5);color:var(--conviction-5t)}
  .memo-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .memo-card-reviewed{font-size:11px;font-family:var(--font-mono);color:var(--ink3)}
  .memo-card-sections{display:flex;flex-wrap:wrap;gap:4px}
  .memo-section-pip{font-size:11px;font-family:var(--font-mono);padding:1px 6px;border-radius:4px;background:var(--surface3);color:var(--ink3)}
  .memo-snippet{font-size:13px;color:var(--ink3);line-height:1.5;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* full memo view */
  .memo-view{display:flex;flex-direction:column;gap:0}
  .memo-view-header{padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:10}
  .memo-view-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .memo-view-ticker{font-family:var(--font-serif);font-size:26px;color:var(--ink)}
  .memo-view-name{font-size:13px;color:var(--ink3);font-family:var(--font-mono);margin-bottom:8px}
  .memo-view-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .memo-view-body{padding:16px;display:flex;flex-direction:column;gap:4px}
  .memo-section{border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:8px}
  .memo-section-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;background:var(--surface2);user-select:none}
  .memo-section-head:hover{background:var(--surface3)}
  .memo-section-label{font-size:11px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:500}
  .memo-section-chevron{font-size:11px;color:var(--ink3);transition:transform .2s}
  .memo-section-chevron.open{transform:rotate(180deg)}
  .memo-section-content{padding:12px 14px;background:var(--surface)}
  .memo-section-content textarea{width:100%;min-height:80px;border:none;outline:none;font-size:14px;font-family:var(--font-body);color:var(--ink);background:transparent;resize:none;line-height:1.65}
  .memo-section-content textarea::placeholder{color:var(--ink3)}
  .memo-section-rendered{font-size:14px;line-height:1.65;color:var(--ink2);white-space:pre-wrap;word-break:break-word;min-height:24px}
  .memo-section-rendered:empty::after{content:attr(data-placeholder);color:var(--ink3);font-style:italic}
  .memo-edit-btn{font-size:11px;font-family:var(--font-mono);padding:3px 8px;border-radius:6px;border:1px solid var(--border2);background:transparent;cursor:pointer;color:var(--ink3);transition:all .15s}
  .memo-edit-btn:hover{border-color:var(--accent);color:var(--accent)}
  .memo-section-edit-footer{display:flex;justify-content:flex-end;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
  .conviction-selector{display:flex;gap:6px;flex-wrap:wrap}
  .conviction-opt{width:36px;height:36px;border-radius:50%;border:2px solid var(--border2);cursor:pointer;font-size:13px;font-family:var(--font-mono);font-weight:500;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--surface2);color:var(--ink2)}
  .conviction-opt:hover{border-color:var(--accent)}
  .conviction-opt.selected{border-width:2px}
  .conviction-opt.sel-1{background:var(--conviction-1);color:var(--conviction-1t);border-color:var(--conviction-1t)}
  .conviction-opt.sel-2{background:var(--conviction-2);color:var(--conviction-2t);border-color:var(--conviction-2t)}
  .conviction-opt.sel-3{background:var(--conviction-3);color:var(--conviction-3t);border-color:var(--conviction-3t)}
  .conviction-opt.sel-4{background:var(--conviction-4);color:var(--conviction-4t);border-color:var(--conviction-4t)}
  .conviction-opt.sel-5{background:var(--conviction-5);color:var(--conviction-5t);border-color:var(--conviction-5t)}
  .log-feed{margin-top:4px}
  .log-feed-header{font-size:11px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:10px 14px 6px;border-top:1px solid var(--border)}
  .log-feed-empty{font-size:13px;color:var(--ink3);font-style:italic;padding:12px 14px}
  .log-feed-item{padding:10px 14px;border-top:1px solid var(--border)}
  .log-feed-date{font-size:11px;font-family:var(--font-mono);color:var(--ink3);margin-bottom:4px}
  .log-feed-body{font-size:13px;color:var(--ink2);line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .back-btn{display:flex;align-items:center;gap:5px;font-size:13px;font-family:var(--font-mono);color:var(--ink3);cursor:pointer;padding:2px 0;transition:color .15s;background:none;border:none}
  .back-btn:hover{color:var(--accent)}
  .memo-add-section-btn{width:100%;padding:10px;background:transparent;border:1px dashed var(--border2);border-radius:var(--r);cursor:pointer;font-family:var(--font-mono);font-size:12px;color:var(--ink3);display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s;margin-top:4px;margin-bottom:8px}
  .memo-add-section-btn:hover{border-color:var(--accent);color:var(--accent)}
  .field-row{margin-bottom:12px}
  .field-label{font-size:11px;font-family:var(--font-mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
  .field-input{width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:14px;font-family:var(--font-body);color:var(--ink);background:var(--surface2);outline:none}
  .field-input:focus{border-color:var(--accent)}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap}
  .section-chip{font-size:11px;font-family:var(--font-mono);padding:4px 10px;border-radius:20px;border:1px solid var(--border2);cursor:pointer;color:var(--ink2);transition:all .15s;background:var(--surface2)}
  .section-chip.active{background:var(--tag-bg);color:var(--tag-txt);border-color:var(--tag-txt)}
</style>
</head>
<body>
<div id="shell">
<div id="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand" id="brand"></div>
      <div class="sync-badge" id="syncBadge" onclick="syncNow()">
        <span class="dot" id="syncDot"></span>
        <span id="syncLabel">Connect Drive</span>
      </div>
    </div>
    <div class="search-bar" id="searchBarWrap">

<script>
const STORAGE_KEY='invest_diary_v2';

/* Account definitions live here because the initial state references them. */
const ACCOUNTS=[
  {id:'gilgamesh',label:'Gilgamesh'},
  {id:'odyssey',  label:'Odyssey'},
  {id:'athena',   label:'Athena'},
];
const DEFAULT_ACCOUNT='gilgamesh';

/* Set at build time. Tap the brand to see it — the fastest way to tell
   whether a device is running a stale cached copy. */
const BUILD_STAMP='2026-08-22 10:46 UTC';

const MEMO_SECTIONS=['thesis','risks','catalysts','management','funding','valuation','technicals','reasons_to_sell','description'];

/* Parse a fuzzy timing phrase into a sortable anchor date.
   "Q3 2026", "Sept 2026", "H2 2026", "2026", "mid 2026", "2026-09" all work.
   Anchor is the END of the stated period so "due by Q3" sorts sensibly.
   Unparseable text is still stored — just not placed on the timeline. */
/* Parse a fuzzy timing phrase, including RANGES, into sortable anchors.
   Single: "Q3 2026", "Sept 2026", "mid 2026", "2026-09", "2026".
   Range:  "Q3-Q4 2026", "Q3 2026 to Q1 2027", "H2 2026", "Sept-Nov 2026".
   Returns {start, end, label} where start/end are 'YYYY-MM-DD', or null.
   For a single point, start===end. Timeline sorts on start so it's seen coming. */
function parseCatalystTiming(raw){
  if(!raw)return null;
  const s=raw.trim().toLowerCase();

  // A lone ISO date must not be split on its own hyphen
  if(/^20\d{2}-\d{1,2}(-\d{1,2})?$/.test(s)){
    const one=parseOnePoint(s,'');
    return one?{start:one.start,end:one.end,label:raw.trim()}:null;
  }

  // Split on range separators into at most two halves
  const parts=s.split(/\s*(?:-|–|—|to|through|thru|until|till)\s*/).filter(Boolean);

  if(parts.length>=2){
    const a=parseOnePoint(parts[0], parts[1]);
    const b=parseOnePoint(parts[1], parts[0]);
    if(a&&b){
      const start=a.start<b.start?a.start:b.start;
      const end=a.end>b.end?a.end:b.end;
      return {start, end, label:raw.trim()};
    }
    // one half parsed — treat as single
    const only=a||b;
    if(only)return {start:only.start, end:only.end, label:raw.trim()};
  }

  const one=parseOnePoint(s, '');
  return one?{start:one.start, end:one.end, label:raw.trim()}:null;
}

/* Parse a single period. `sibling` lets "Q3-Q4 2026" borrow the year that
   only appears on the other half. Returns {start,end} spanning the period. */
function parseOnePoint(s, sibling){
  const endOfMonth=(y,m)=>`${y}-${String(m).padStart(2,'0')}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`;
  const startOfMonth=(y,m)=>`${y}-${String(m).padStart(2,'0')}-01`;

  const yearIn=(t)=>{ const m=(t||'').match(/(20\d{2})/); return m?parseInt(m[1]):null; };
  let year=yearIn(s)||yearIn(sibling);
  const now=new Date();

  // ISO YYYY-MM
  const iso=s.match(/(20\d{2})-(\d{1,2})/);
  if(iso){ const y=parseInt(iso[1]),m=parseInt(iso[2]); return {start:startOfMonth(y,m),end:endOfMonth(y,m)}; }

  const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12,
    january:1,february:2,march:3,april:4,june:6,july:7,august:8,september:9,october:10,november:11,december:12};

  const q=s.match(/q([1-4])/);
  if(q){ const y=year||now.getFullYear(); const m=parseInt(q[1])*3; return {start:startOfMonth(y,m-2),end:endOfMonth(y,m)}; }

  const h=s.match(/h([12])/);
  if(h){ const y=year||now.getFullYear(); return h[1]==='1'?{start:startOfMonth(y,1),end:endOfMonth(y,6)}:{start:startOfMonth(y,7),end:endOfMonth(y,12)}; }

  for(const name of Object.keys(months).sort((a,b)=>b.length-a.length)){
    if(new RegExp('\\b'+name).test(s)){ const y=year||now.getFullYear(); const m=months[name]; return {start:startOfMonth(y,m),end:endOfMonth(y,m)}; }
  }

  if(year){
    if(/\bend\b|\blate\b/.test(s))     return {start:startOfMonth(year,10),end:endOfMonth(year,12)};
    if(/\bmid\b/.test(s))              return {start:startOfMonth(year,5), end:endOfMonth(year,8)};
    if(/\bearly\b|\bstart\b/.test(s))  return {start:startOfMonth(year,1), end:endOfMonth(year,3)};
    return {start:startOfMonth(year,1), end:endOfMonth(year,12)};
  }
  return null;
}
const SECTION_LABELS={thesis:'Investment Thesis',risks:'Risks',catalysts:'Catalysts',management:'Management & Shareholders',funding:'Funding',valuation:'Valuation',technicals:'Technicals',reasons_to_sell:'Reasons to Sell',description:'Description'};

let state={
  entries:[],memos:[],
  driveFileId:null,driveSynced:false,driveToken:null,
  sheetsId:null,sheetsToken:null,portfolio:[],portfolioSyncedAt:null,portfolioMeta:null,activeAccount:DEFAULT_ACCOUNT,hideValues:false,
  tickerTags:{},portSelectMode:false,portSelected:{},
  lastLocalChange:0,dirty:false,lastSyncedAt:null,lastSyncRemoteTime:null,lastSeenDriveModified:null,syncConflict:null,
  portSectorFilter:null,portGeoFilter:null,portView:'holdings',portSort:'weight',
  activeTicker:null,tickerSort:'recent',tickerFilter:'all',
  oauthClientId:null,oauthClientSecret:null,oauthRefreshToken:null,oauthAccessToken:null,oauthExpiry:0,
  activeTab:'log',searchQuery:'',filterTickers:[],filterHashes:[],stanceEditFor:null,viewsOpen:false,viewExpanded:null,
  activeMemoId:null
};

function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const s=JSON.parse(raw);
      state.entries=s.entries||[];state.memos=s.memos||[];
      state.driveFileId=s.driveFileId||null;
      state.sheetsId=s.sheetsId||null;state.sheetsToken=s.sheetsToken||null;
      state.portfolio=s.portfolio||[];state.portfolioSyncedAt=s.portfolioSyncedAt||null;state.portfolioMeta=s.portfolioMeta||null;
      state.activeAccount=s.activeAccount||DEFAULT_ACCOUNT;
      state.hideValues=!!s.hideValues;
      migratePortfolioToAccounts();
      state.tickerTags=s.tickerTags||{};state.lastLocalChange=s.lastLocalChange||0;
      state.dirty=!!s.dirty;
      state.lastSyncedAt=s.lastSyncedAt||null;
      state.lastSyncRemoteTime=s.lastSyncRemoteTime||null;
      state.lastSeenDriveModified=s.lastSeenDriveModified||null;
      state.syncConflict=s.syncConflict||null;
      // Migration: lastLocalChange used to mean "last sync time". If this device
      // was synced under the old scheme, treat that stamp as the last sync.
      if(state.lastLocalChange&&!state.lastSyncedAt&&!('dirty' in s)){
        state.lastSyncedAt=state.lastLocalChange;state.dirty=false;
      }
      // Migrate any catalysts stored under the old single-anchor shape
      (s.memos||[]).forEach(m=>{
        if(m.mgmt>3)m.mgmt=3;   // legacy 5-star ratings clamp to the new 3-star scale
        (m.catalysts||[]).forEach(cat=>{
          if(cat.anchor&&!cat.start){cat.start=cat.anchor;cat.end=cat.anchor;delete cat.anchor;}
        });
      });

      state.oauthClientId=s.oauthClientId||null;state.oauthClientSecret=s.oauthClientSecret||null;
      state.oauthRefreshToken=s.oauthRefreshToken||null;state.oauthAccessToken=s.oauthAccessToken||null;state.oauthExpiry=s.oauthExpiry||0;
    }
    const oldRaw=localStorage.getItem('invest_diary_v1');
    if(oldRaw&&!state.entries.length){const old=JSON.parse(oldRaw);state.entries=old.entries||[];}
  }catch(e){}
}
function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify({
    entries:state.entries,memos:state.memos,driveFileId:state.driveFileId,
    sheetsId:state.sheetsId,sheetsToken:state.sheetsToken,
    portfolio:state.portfolio,portfolioSyncedAt:state.portfolioSyncedAt,portfolioMeta:state.portfolioMeta,activeAccount:state.activeAccount,hideValues:state.hideValues,
    tickerTags:state.tickerTags,lastLocalChange:state.lastLocalChange,
    dirty:state.dirty,lastSyncedAt:state.lastSyncedAt,lastSyncRemoteTime:state.lastSyncRemoteTime,
    lastSeenDriveModified:state.lastSeenDriveModified,syncConflict:state.syncConflict,

    oauthClientId:state.oauthClientId,oauthClientSecret:state.oauthClientSecret,
    oauthRefreshToken:state.oauthRefreshToken,oauthAccessToken:state.oauthAccessToken,oauthExpiry:state.oauthExpiry
  }));
}
load();

/* $mno and $MNO are the same holding. Case is ignored on the way in and the
   tag is stored uppercase, so a lowercase entry files itself correctly.

   The trailing guard matters more than the case change: without it, "$Meridian"
   used to silently produce a bogus $M tag (and, once lowercase is allowed,
   would produce $MERID). Requiring a non-letter after the symbol means an
   ordinary word following a $ now yields nothing at all, which is the honest
   outcome. Amounts like $50m and CA$1.70 never matched and still don't. */
const TICKER_RE=/\$([A-Za-z]{1,5}(?:\.[A-Za-z]{1,2})?)(?![A-Za-z0-9])/g;
function extractTickers(text){
  return[...new Set((String(text||'').match(TICKER_RE)||[]).map(t=>t.toUpperCase()))];
}
function extractHashes(text){return[...new Set((text.match(/#([a-zA-Z][a-zA-Z0-9_]*)/g)||[]).map(h=>h.toLowerCase()))];}
/* ══ Top-down views ════════════════════════════════════════════════════
   A view is not a new kind of object. It is an ordinary log entry carrying a
   #view tag — so it is written the way you already write, and versioning
   falls out of the log being immutable and timestamped.

   Unlike a stance, a view is NEVER overwritten. The newest entry for a theme
   is surfaced as current; every earlier one stays exactly where it is, in the
   log and in search. Seeing how a view has changed is the point.

   Syntax: #view for a general view, #view_gold / #viewgold for a theme.
   No new parser and no new sigil — this rides on the existing hashtags. */
const VIEW_STALE_DAYS=90;
function viewThemeOf(hash){
  const m=String(hash||'').match(/^#view[_-]?(.*)$/i);
  if(!m)return null;
  return (m[1]||'general').toLowerCase();
}
function entryViewThemes(e){
  return (e.hashes||[]).map(viewThemeOf).filter(Boolean);
}
function isViewEntry(e){return entryViewThemes(e).length>0;}
function themeLabel(theme){
  if(theme==='general')return 'General';
  return theme.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}
/* One entry per theme — newest first, with the whole history kept. */
function viewThemes(){
  const map={};
  state.entries.forEach(e=>{
    entryViewThemes(e).forEach(theme=>{
      if(!map[theme])map[theme]={theme,label:themeLabel(theme),entries:[]};
      map[theme].entries.push(e);
    });
  });
  return Object.values(map).map(v=>{
    v.entries.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
    v.current=v.entries[0];
    v.versions=v.entries.length;
    v.updated=new Date(v.current.ts).getTime();
    v.ageDays=Math.floor((Date.now()-v.updated)/86400000);
    v.stale=v.ageDays>VIEW_STALE_DAYS;
    return v;
  }).sort((a,b)=>b.updated-a.updated);
}
function currentView(theme){
  const v=viewThemes().find(x=>x.theme===theme);
  return v?v.current:null;
}
/* Show every version of one theme, oldest change visible — the log filtered
   to that tag, which is exactly what search would give you. */
function showViewHistory(theme){
  const v=viewThemes().find(x=>x.theme===theme);
  if(!v)return;
  const tag=(v.current.hashes||[]).find(h=>viewThemeOf(h)===theme);
  state.filterHashes=tag?[tag]:[];
  state.filterTickers=[];
  state.viewsOpen=false;
  setTab('log');
}
function toggleViewsPanel(){
  state.viewsOpen=!state.viewsOpen;
  render();
}
function toggleViewExpand(theme){
  state.viewExpanded=state.viewExpanded===theme?null:theme;
  render();
}

function renderMd(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code style="font-family:var(--font-mono);font-size:12px;background:var(--surface3);padding:1px 4px;border-radius:3px">$1</code>')
    .replace(/\$([A-Za-z]{1,5}(?:\.[A-Za-z]{1,2})?)(?![A-Za-z0-9])/g,(m,sym)=>`<span style="font-family:var(--font-mono);font-weight:500;color:var(--tag-txt)">$${sym.toUpperCase()}</span>`)
    .replace(/#([a-zA-Z][a-zA-Z0-9_]*)/g,'<span style="font-family:var(--font-mono);color:var(--hash-txt)">#$1</span>');
}
function highlight(text,query){
  if(!query)return text;
  const esc=query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return text.replace(new RegExp(`(${esc})`,'gi'),'<mark>$1</mark>');
}
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function fmtDateShort(iso){return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function fmtDateRelative(iso){
  const diff=Date.now()-new Date(iso).getTime();
  const days=Math.floor(diff/86400000);
  if(days===0)return'Today';if(days===1)return'Yesterday';if(days<7)return`${days}d ago`;
  if(days<30)return`${Math.floor(days/7)}w ago`;if(days<365)return`${Math.floor(days/30)}mo ago`;
  return`${Math.floor(days/365)}y ago`;
}
function convictionLabel(n){return['','Watching','Interested','Conviction','High Conv.','Core'][n]||'';}
function allTickers(){const map={};state.entries.forEach(e=>e.tickers.forEach(t=>{map[t]=(map[t]||0)+1;}));return Object.entries(map).sort((a,b)=>b[1]-a[1]);}
function allHashes(){const map={};state.entries.forEach(e=>e.hashes.forEach(h=>{map[h]=(map[h]||0)+1;}));return Object.entries(map).sort((a,b)=>b[1]-a[1]);}
function filteredEntries(){
  let list=[...state.entries].sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  const q=state.searchQuery.trim().toLowerCase();
  if(q)list=list.filter(e=>e.text.toLowerCase().includes(q)||e.tickers.some(t=>t.toLowerCase().includes(q))||e.hashes.some(h=>h.toLowerCase().includes(q)));
  if(state.filterTickers.length)list=list.filter(e=>state.filterTickers.every(t=>e.tickers.includes(t)));
  if(state.filterHashes.length)list=list.filter(e=>state.filterHashes.every(h=>e.hashes.includes(h)));
  return list;
}
function setTab(tab,opts){
  state.activeTab=tab;
  // A bare tab click always lands on the list. Only an explicit payload
  // (e.g. goToTicker) opens a detail view.
  state.activeMemoId    = (opts&&opts.memoId) || null;
  state.activeTicker    = (tab==='tickers' && opts && opts.ticker) ? opts.ticker : null;
  document.querySelectorAll('.tab').forEach((el,i)=>{
    el.classList.toggle('active',['log','memos','portfolio','tickers'][i]===tab);
  });
  // show/hide search bar
  const sw=document.getElementById('searchBarWrap');
  if(sw)sw.style.display=(tab==='memos'||tab==='portfolio'?'none':'flex');
  const fc=document.getElementById('filterChips');
  if(fc&&(tab==='memos'||tab==='portfolio'))fc.innerHTML='';
  render();
}
function onSearch(){state.searchQuery=document.getElementById('searchInput').value;render();}
function toggleStanceEdit(id){
  state.stanceEditFor=state.stanceEditFor===id?null:id;
  render();
}
function toggleFilter(type,val){
  const arr=type==='ticker'?state.filterTickers:state.filterHashes;
  const idx=arr.indexOf(val);if(idx>=0)arr.splice(idx,1);else arr.push(val);render();
}
function renderFilterChips(){
  if(state.activeTab==='memos')return;
  const chips=document.getElementById('filterChips');
  const tickers=allTickers().slice(0,8);const hashes=allHashes().slice(0,5);
  if(!tickers.length&&!hashes.length){chips.innerHTML='';return;}
  chips.innerHTML=tickers.map(([t])=>`<div class="filter-chip ${state.filterTickers.includes(t)?'active':''}" onclick="toggleFilter('ticker','${t}')">${t}</div>`).join('')
    +hashes.map(([h])=>`<div class="filter-chip hash-chip ${state.filterHashes.includes(h)?'active':''}" onclick="toggleFilter('hash','${h}')">${h}</div>`).join('');
}
function render(){
  renderFilterChips();
  refreshSyncBadge();
  const el=document.getElementById('mainContent');
  if(state.activeTab==='log')el.innerHTML=renderLog();
  else if(state.activeTab==='memos')renderMemosTab(el);
  else if(state.activeTab==='portfolio')el.innerHTML=renderPortfolio();
  else el.innerHTML=renderTickers();
  // Grids get the extra width on desktop; the log and memos stay one column
  document.getElementById('app').classList.toggle('wide',
    state.activeTab==='tickers'||state.activeTab==='portfolio');
  renderContextRail();
  // FAB
  const fab=document.getElementById('fab');
  if(state.activeTab==='memos'&&state.activeMemoId){fab.style.display='none';}
  else if(state.activeTab==='memos'){fab.textContent='+';fab.style.display='flex';}
  else{fab.textContent='+';fab.style.display='flex';}
}
function onFab(){
  if(state.activeTab==='memos')openNewMemoModal();
  else openCompose();
}

/* The desktop rail: the pre-action context that is otherwise collapsed or a
   tab away. Hidden entirely below 1080px, so the phone is untouched. */
function renderContextRail(){
  const rail=document.getElementById('contextRail');
  if(!rail)return;
  if(window.innerWidth<1080){rail.innerHTML='';return;}

  // Current top-down views
  const views=viewThemes();
  const viewCard=`<div class="rail-card">
    <div class="rail-title">Top-down views ${views.filter(v=>v.stale).length?`<span style="font-size:10px;font-family:var(--font-mono);color:var(--warn-txt)">${views.filter(v=>v.stale).length} ⏳</span>`:''}</div>
    ${views.length?views.slice(0,6).map(v=>`<div class="rail-row" onclick="showViewHistory('${v.theme}')">
        <span style="font-family:var(--font-mono);font-size:12px;color:var(--tag-txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v.label}</span>
        <span style="font-size:10px;font-family:var(--font-mono);color:${v.stale?'var(--warn-txt)':'var(--ink3)'};white-space:nowrap">${v.ageDays===0?'today':v.ageDays+'d'}</span>
      </div>`).join('')
      :`<div class="rail-empty">Tag a log entry <span style="font-family:var(--font-mono)">#view_gold</span> to track a macro call over time.</div>`}
  </div>`;

  // Open stances, action-first
  const board=stanceBoard();
  const stanceCard=`<div class="rail-card">
    <div class="rail-title">Stances ${board.filter(b=>b.stale).length?`<span style="font-size:10px;font-family:var(--font-mono);color:var(--warn-txt)">${board.filter(b=>b.stale).length} ⏳</span>`:''}</div>
    ${board.length?board.slice(0,10).map(b=>`<div class="rail-row" onclick="goToTicker('${b.symbol}')">
        <span style="font-family:var(--font-mono);font-size:12px;color:var(--tag-txt)">${b.symbol}</span>
        <span style="display:flex;align-items:center;gap:6px;white-space:nowrap">
          ${stanceBadge(b.symbol)}
          <span style="font-size:10px;font-family:var(--font-mono);color:${b.stale?'var(--warn-txt)':'var(--ink3)'}">${b.age===0?'today':b.age+'d'}</span>
        </span>
      </div>`).join('')
      :`<div class="rail-empty">Set a stance from any ticker to see it here.</div>`}
  </div>`;

  /* Holdings with no memo, biggest first — the honest answer to "which one
     should I write next". */
  const noMemo=tickerArchive()
    .filter(t=>t.holding&&!t.memo)
    .sort((a,b)=>b.weight-a.weight)
    .slice(0,8);
  const memoCard=`<div class="rail-card">
    <div class="rail-title">Memos to write ${noMemo.length?`<span style="font-size:10px;font-family:var(--font-mono);color:var(--ink3)">${tickerArchive().filter(t=>t.holding&&!t.memo).length}</span>`:''}</div>
    ${noMemo.length?noMemo.map(t=>`<div class="rail-row" onclick="openTickerMemo('${t.symbol}')">
        <span style="font-family:var(--font-mono);font-size:12px;color:var(--tag-txt)">${t.symbol}</span>
        <span style="font-size:10px;font-family:var(--font-mono);color:var(--ink3);white-space:nowrap">${(t.weight*100).toFixed(1)}%${seedCountFor(t.symbol)?` · ${seedCountFor(t.symbol)} log${seedCountFor(t.symbol)===1?'':'s'}`:''}</span>
      </div>`).join('')
      :`<div class="rail-empty">Every holding has a memo. Good.</div>`}
  </div>`;

  rail.innerHTML=viewCard+stanceCard+memoCard;
}
// Rail appears and disappears with the viewport
window.addEventListener('resize',()=>{
  clearTimeout(window.__railTimer);
  window.__railTimer=setTimeout(renderContextRail,150);
});

/* ══════════════════════════════════════
   LOG TAB
══════════════════════════════════════ */
function renderLog(){
  const entries=filteredEntries();
  const composeHtml=`<div class="compose-card" id="composeCard" style="display:none">
    <div class="compose-label">Quick log</div>
    <textarea class="compose-area" id="composeText" placeholder="What's on your mind? Try: Bought more $MSFT today — strong earnings #thesis #tech&#10;Tag a macro call with #view_gold to track it over time." oninput="onComposeInput()" rows="4"></textarea>
    <div class="preview-tags" id="composeTags"></div>
    <div class="compose-footer">
      <div></div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost" onclick="closeCompose()">Cancel</button>
        <button class="btn btn-primary" id="submitBtn" onclick="submitEntry()" disabled>Save entry</button>
      </div>
    </div>
  </div>`;
  if(!entries.length){
    return composeHtml+`<div class="empty-state"><div class="empty-icon">📓</div><div class="empty-title">Your diary is empty</div><div class="empty-body">Tap + to log your first investment note.<br>Use <code style="font-family:var(--font-mono);font-size:12px">$MSFT</code> for tickers and <code style="font-family:var(--font-mono);font-size:12px">#earnings</code> for tags.</div></div>`;
  }
  return composeHtml+renderViewsBand()+entries.map(e=>renderEntry(e)).join('');
}

/* Sits above the log, collapsed by default. Appears only once a #view entry
   exists, so nothing changes until the feature is used. */
function renderViewsBand(){
  const views=viewThemes();
  if(!views.length)return '';
  // Hide while filtering or searching — the log is showing something specific.
  if(state.searchQuery.trim()||state.filterHashes.length||state.filterTickers.length)return '';
  const staleCount=views.filter(v=>v.stale).length;
  const head=`<div onclick="toggleViewsPanel()" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface2);cursor:pointer;${state.viewsOpen?'border-bottom-left-radius:0;border-bottom-right-radius:0;':''}margin-bottom:${state.viewsOpen?'0':'12px'}">
      <div style="display:flex;align-items:center;gap:8px;min-width:0">
        <span style="font-family:var(--font-serif);font-size:15px;color:var(--ink)">Top-down views</span>
        <span style="font-size:10px;font-family:var(--font-mono);color:var(--ink3)">${views.length}</span>
        ${staleCount?`<span style="font-size:10px;font-family:var(--font-mono);color:var(--warn-txt)">${staleCount} ⏳</span>`:''}
      </div>
      <span style="color:var(--ink3);font-size:12px">${state.viewsOpen?'▲':'▼'}</span>
    </div>`;
  if(!state.viewsOpen){
    // Collapsed: the freshest themes as a single quiet line.
    return head.replace('margin-bottom:0','margin-bottom:12px');
  }
  const body=views.map(v=>{
    const expanded=state.viewExpanded===v.theme;
    const age=v.ageDays===0?'today':v.ageDays===1?'yesterday':v.ageDays+'d ago';
    return `<div style="padding:10px 12px;border-top:1px solid var(--border)">
      <div onclick="toggleViewExpand('${v.theme}')" style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;cursor:pointer">
        <span style="font-family:var(--font-mono);font-size:12px;color:var(--tag-txt)">${v.label}</span>
        <span style="font-size:10px;font-family:var(--font-mono);color:${v.stale?'var(--warn-txt)':'var(--ink3)'};white-space:nowrap">${age}${v.stale?' · worth revisiting':''}</span>
      </div>
      <div style="font-size:13px;color:var(--ink2);line-height:1.6;margin-top:6px;${expanded?'':'display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden'}">${renderMd(v.current.text)}</div>
      <div style="display:flex;gap:10px;margin-top:8px">
        <span onclick="toggleViewExpand('${v.theme}')" style="font-size:10px;font-family:var(--font-mono);color:var(--ink3);cursor:pointer">${expanded?'▲ less':'▼ more'}</span>
        ${v.versions>1?`<span onclick="showViewHistory('${v.theme}')" style="font-size:10px;font-family:var(--font-mono);color:var(--tag-txt);cursor:pointer">⧉ ${v.versions} versions</span>`:''}
      </div>
    </div>`;
  }).join('');
  return head+`<div style="border:1px solid var(--border2);border-top:none;border-radius:0 0 var(--r) var(--r);background:var(--surface);margin-bottom:12px">${body}</div>`;
}
function renderEntry(e,compact=false){
  const tickerTags=e.tickers.map(t=>{
    const badge=stanceBadge(t);
    return `<span class="tag ticker" onclick="event.stopPropagation();goToTicker('${t}')">${t}</span>${badge?`<span style="margin-left:-2px">${badge}</span>`:''}`;
  }).join('');
  const hashTags=e.hashes.map(h=>`<span class="tag hash" onclick="toggleFilter('hash','${h}')">${h}</span>`).join('');
  const bodyHtml=highlight(renderMd(e.text),state.searchQuery);
  /* A view entry is flagged in place, and superseded ones say so — the older
     version is never removed, just labelled. */
  const vThemes=entryViewThemes(e);
  const viewFlag=vThemes.length?(()=>{
    const isCurrent=vThemes.some(th=>{const c=currentView(th);return c&&c.id===e.id;});

    </div>`;
  })():'';
  if(compact)return`<div style="padding:8px 0;border-bottom:1px solid var(--border)">
    <div class="entry-date">${fmtDate(e.ts)}</div>
    <div class="entry-body" style="font-size:13px;margin-top:4px">${bodyHtml}</div>
    <div class="entry-tags" style="margin-top:6px">${tickerTags}${hashTags}</div>
  </div>`;
  return`<div class="entry-card" id="entry-${e.id}">
    ${viewFlag}
    <div class="entry-meta">
      <div class="entry-date">${fmtDate(e.ts)}</div>
      <div class="entry-actions">
        <button class="icon-btn" onclick="editEntry('${e.id}')" title="Edit">✎</button>
        <button class="icon-btn" onclick="deleteEntry('${e.id}')" title="Delete">⊗</button>
      </div>
    </div>
    <div class="entry-body">${bodyHtml}</div>
    <div class="entry-tags">${tickerTags}${hashTags}</div>
    ${state.stanceEditFor===e.id&&e.tickers.length?`<div style="margin-top:8px;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r)">
      ${e.tickers.map(t=>`<div style="margin-bottom:6px">
        <div style="font-size:10px;font-family:var(--font-mono);color:var(--ink3);margin-bottom:4px">${bareSym(t)} stance</div>
        ${stanceChips(t,'sm')}
      </div>`).join('')}
      <div style="font-size:10px;font-family:var(--font-mono);color:var(--ink3)">Tap the active one again to clear it.</div>
    </div>`:''}
    ${e.tickers.length?`<button class="icon-btn" style="font-size:10px;font-family:var(--font-mono);padding:2px 0;margin-top:4px" onclick="event.stopPropagation();toggleStanceEdit('${e.id}')">${state.stanceEditFor===e.id?'▲ hide stance':'⊹ set stance'}</button>`:''}

}

/* ── Backup export ──────────────────────────────────────────────────
   Independent of the app's data model, so nothing I break later can lose
   your writing. CSV for reading anywhere; JSON for a complete restore. */
function csvCell(v){
  const s=(v==null?'':String(v));
  // Always quote; double any embedded quotes. Excel-safe.
  return '"'+s.replace(/"/g,'""')+'"';
}
function exportAll(format){
  const stamp=new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');

  if(format==='json'){
    // Complete, restorable snapshot of everything you've written
    const payload={
      exportedAt:new Date().toISOString(),
      version:'invest-diary-v2',
      memos:state.memos,
      entries:state.entries,
      tickerTags:state.tickerTags,
      portfolio:state.portfolio,
      portfolioMeta:state.portfolioMeta,
    };
    downloadFile(`invest-diary-backup-${stamp}.json`, JSON.stringify(payload,null,2), 'application/json');
    showToast('Full backup downloaded');
    return;
  }

  // CSV: one row per memo, every field flattened, plus a second file-worth
  // of log rows appended under a divider so a single file has everything.
  const secCols=MEMO_SECTIONS;
  const memoHeader=['type','ticker','name','conviction','mgmt_rating','catalyst_events','created','updated',...secCols.map(s=>'section_'+s)];
  const rows=[memoHeader.map(csvCell).join(',')];

  state.memos.forEach(m=>{
    const catStr=(m.catalysts||[]).map(x=>`${x.text} [${x.timing||'no date'}${x.done?', done':''}]`).join(' | ');
    const row=[
      'memo', m.ticker, m.name||'', m.conviction||'', m.mgmt||'', catStr,
      m.createdAt||'', m.updatedAt||'',
      ...secCols.map(s=>(m.sections&&m.sections[s])||'')
    ];
    rows.push(row.map(csvCell).join(','));
  });

  // Blank line, then logs with their own header
  rows.push('');
  rows.push(['type','timestamp','tickers','tags','text'].map(csvCell).join(','));
  [...state.entries]
    .sort((a,b)=>new Date(a.ts)-new Date(b.ts))
    .forEach(e=>{
      rows.push([
        'log', e.ts,
        (e.tickers||[]).join(' '),
        (e.hashes||[]).join(' '),
        e.text||''
      ].map(csvCell).join(','));
    });

  downloadFile(`invest-diary-${stamp}.csv`, rows.join(String.fromCharCode(13,10)), 'text/csv');
  showToast(`Exported ${state.memos.length} memos, ${state.entries.length} logs`);
}

function downloadFile(filename, content, mime){
  const blob=new Blob([content],{type:mime+';charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function renderMemoCard(m){

  const mgmtBadge=m.mgmt?`<span class="conviction-badge" style="background:var(--conviction-2);color:var(--conviction-2t)"><span style="letter-spacing:1px">${'★'.repeat(m.mgmt)}</span></span>`:'';

function renderCatalystSection(memo){
  const cats=memo.catalysts||[];
  const rows=cats.map((cat,i)=>{
    const parsed=cat.start?fmtCatalystRange(cat.start,cat.end):'';
    const overdue=cat.end&&!cat.done&&new Date(cat.end)<new Date();
    return `<div class="memo-section" style="border:1px solid var(--border2);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;${cat.done?'opacity:.55;':''}">
      <div style="display:flex;align-items:flex-start;gap:8px">
        <div onclick="toggleCatalystDone('${memo.id}',${i})" style="width:18px;height:18px;border-radius:5px;border:2px solid ${cat.done?'var(--accent)':'var(--border2)'};background:${cat.done?'var(--accent)':'transparent'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;flex-shrink:0;margin-top:2px">${cat.done?'✓':''}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;line-height:1.4;color:var(--ink);${cat.done?'text-decoration:line-through':''}">${cat.text||''}</div>

            ${cat.timing?`<span style="font-family:var(--font-mono);font-size:11px;padding:2px 8px;border-radius:10px;background:${overdue?'var(--warn-bg)':'var(--accent2)'};color:${overdue?'var(--warn-txt)':'var(--accent)'}">${cat.timing}${overdue?' · overdue':''}</span>`:'<span style="font-family:var(--font-mono);font-size:11px;color:var(--ink3)">no date</span>'}
          </div>
        </div>
        <button class="icon-btn" onclick="removeCatalyst('${memo.id}',${i})" style="flex-shrink:0">✕</button>
      </div>
    </div>`;
  }).join('');

  const label=SECTION_LABELS['catalysts'];
  return `<div class="memo-section" id="msec-${memo.id}-catalysts">
    <div class="memo-section-head" onclick="toggleMemoSection('${memo.id}','catalysts')">

      <span class="memo-section-chevron open" id="chev-${memo.id}-catalysts">▼</span>
    </div>

      ${rows||'<div style="font-size:13px;color:var(--ink3);margin-bottom:8px">No catalysts yet. Add expected events with rough timing, and they\'ll appear on the portfolio timeline.</div>'}
      <div style="display:flex;gap:6px;margin-top:8px">
        <input class="field-input" id="newCatText-${memo.id}" placeholder="e.g. Maiden resource estimate" style="flex:2">
        <input class="field-input" id="newCatTiming-${memo.id}" placeholder="Q3 2026" style="flex:1;font-family:var(--font-mono)">

}

function fmtCatalystDate(d){
  return new Date(d).toLocaleDateString('en-GB',{month:'short',year:'numeric'});
}
function fmtCatalystRange(start,end){
  if(!start)return '';
  if(!end||start===end)return fmtCatalystDate(start);
  const a=fmtCatalystDate(start), b=fmtCatalystDate(end);
  return a===b?a:`${a} – ${b}`;
}

function addCatalyst(memoId){
  const memo=state.memos.find(m=>m.id===memoId);
  if(!memo)return;
  const text=(document.getElementById('newCatText-'+memoId)?.value||'').trim();
  const timing=(document.getElementById('newCatTiming-'+memoId)?.value||'').trim();
  if(!text){showToast('Describe the catalyst');return;}
  const parsed=parseCatalystTiming(timing);
  if(!memo.catalysts)memo.catalysts=[];
  memo.catalysts.push({
    text, timing,
    start: parsed?parsed.start:null,
    end:   parsed?parsed.end:null,
    done:false,
    addedAt:new Date().toISOString(),
  });
  memo.updatedAt=new Date().toISOString();
  save();renderMemoView(document.getElementById('mainContent'));
  showToast(parsed?`Added — ${fmtCatalystRange(parsed.start,parsed.end)}`:'Added (timing not recognised)');
  markDirty();
}
function removeCatalyst(memoId,i){
  const memo=state.memos.find(m=>m.id===memoId);
  if(!memo||!memo.catalysts)return;
  memo.catalysts.splice(i,1);
  memo.updatedAt=new Date().toISOString();
  save();renderMemoView(document.getElementById('mainContent'));
  markDirty();
}
function toggleCatalystDone(memoId,i){
  const memo=state.memos.find(m=>m.id===memoId);
  if(!memo||!memo.catalysts||!memo.catalysts[i])return;
  memo.catalysts[i].done=!memo.catalysts[i].done;
  memo.updatedAt=new Date().toISOString();
  save();renderMemoView(document.getElementById('mainContent'));
  markDirty();
}

function toggleMemoSection(memoId,sectionKey){
  const content=document.getElementById(`msc-${memoId}-${sectionKey}`);
  const chev=document.getElementById(`chev-${memoId}-${sectionKey}`);
  if(!content)return;
  const hidden=content.style.display==='none';
  content.style.display=hidden?'block':'none';
  if(chev)chev.classList.toggle('open',hidden);
}

function startSectionEdit(memoId,sectionKey){
  window[`editing_${memoId}_${sectionKey}`]=true;
  const el=document.getElementById('mainContent');
  renderMemoView(el);
  setTimeout(()=>{
    const ta=document.getElementById(`msta-${memoId}-${sectionKey}`);
    if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}
  },50);
}
function cancelSectionEdit(memoId,sectionKey){
  window[`editing_${memoId}_${sectionKey}`]=false;
  renderMemoView(document.getElementById('mainContent'));
}
function saveSectionEdit(memoId,sectionKey){
  const ta=document.getElementById(`msta-${memoId}-${sectionKey}`);
  if(!ta)return;
  const memo=state.memos.find(m=>m.id===memoId);
  if(!memo)return;
  if(!memo.sections)memo.sections={};
  memo.sections[sectionKey]=ta.value;
  memo.updatedAt=new Date().toISOString();
  window[`editing_${memoId}_${sectionKey}`]=false;
  save();
  showToast('Section saved');
  renderMemoView(document.getElementById('mainContent'));
  markDirty();
}

function renderMgmtStars(n){

/* Your own past words about a holding, newest first, as raw material for the
   thesis. Editing beats composing, and a blank page is where the backfill
   stalls. Nothing is invented and nothing is summarised — these are verbatim
   log entries with their dates, for you to cut down. */
function seedTextFor(ticker){
  const sym=primarySymbol(ticker);
  if(!sym)return '';
  const rel=state.entries
    .filter(e=>(e.tickers||[]).some(t=>primarySymbol(t)===sym))
    .sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  if(!rel.length)return '';
  return rel.map(e=>{
    const d=new Date(e.ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    return `**${d}** — ${e.text.trim()}`;
  }).join('\n\n');
}
function seedCountFor(ticker){
  const sym=primarySymbol(ticker);
  if(!sym)return 0;

}

/* ══ Company identity ══════════════════════════════════════════════════
   A broker export can list one company twice: same symbol on two exchanges
   (MNO on TSX-V and AIM), or two symbols for one company (USAS on NYSE
   American, USA on TSX). Both are a single position.

   Every function here resolves that at READ time. No stored log entry, memo
   or portfolio row is ever rewritten, so removing a link restores the
   previous behaviour exactly. */
/* Sector and geography names are typed by hand, so they can contain quotes,
   ampersands and apostrophes. Interpolating them raw into an onclick attribute
   breaks the attribute — a name containing a double quote silently produced a
   dead, unclickable row. Escape for the JS string first, then for HTML. */
function jsAttr(v){
  return String(v==null?'':v)
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/[\r\n]/g,' ');
}
function htmlText(v){
  return String(v==null?'':v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function bareSym(s){return String(s==null?'':s).replace(/^\$/,'').trim().toUpperCase();}

/* ══ Stance ════════════════════════════════════════════════════════════
   What I intend to do about a holding right now — one current value, always
   optional. Deliberately separate from hashtags: a hashtag records what you
   thought on a given day and stays attached forever, which is right for the
   log and wrong for a current intention.

   Stored on the company's primary symbol, so a second listing can't carry a
   contradictory stance, and read at write-time-of-day only. Every change
   records `since`, which is what lets the app tell you a stance has gone
   stale rather than asking you to audit them yourself. */
const STANCES={
  watch:    {label:'Watching',    short:'Watch', colour:'var(--ink3)'},
  research: {label:'Research',    short:'Rsrch', colour:'var(--hash-txt)'},
  buy:      {label:'Want to buy', short:'Buy',   colour:'var(--accent)'},
  hold:     {label:'Hold',        short:'Hold',  colour:'var(--tag-txt)'},
  trim:     {label:'Trim',        short:'Trim',  colour:'var(--hash-txt)'},
  sell:     {label:'Look to sell',short:'Sell',  colour:'var(--danger)'},
};
const STANCE_ORDER=['research','buy','trim','sell','hold','watch'];
/* How long a stance may sit untouched before it is worth a second look.
   An intention to act decays faster than a decision to sit still. */
const STANCE_STALE_DAYS={research:30,buy:60,trim:60,sell:45,hold:180,watch:120};

function stanceFor(sym){
  const t=state.tickerTags[primarySymbol(sym)]||{};
  return STANCES[t.stance]?t.stance:'';
}
function stanceSince(sym){
  const t=state.tickerTags[primarySymbol(sym)]||{};
  return t.stanceSince||null;
}
function stanceAgeDays(sym){
  const since=stanceSince(sym);
  if(!since)return null;
  return Math.floor((Date.now()-new Date(since).getTime())/86400000);
}
function stanceIsStale(sym){
  const st=stanceFor(sym);if(!st)return false;
  const age=stanceAgeDays(sym);
  return age!=null&&age>(STANCE_STALE_DAYS[st]||90);
}
/* One tap, no modal, no save button. Tapping the active stance clears it —
   nothing is ever forced, and "no stance" stays a valid resting state. */
function setStance(sym,st){
  const key=primarySymbol(sym);
  const t=state.tickerTags[key]||{};
  if(!st||t.stance===st){ delete t.stance; delete t.stanceSince; }
  else { t.stance=st; t.stanceSince=new Date().toISOString(); }
  state.tickerTags[key]=t;
  if(!Object.keys(t).length)delete state.tickerTags[key];
  save();render();markDirty();
  showToast(t.stance?`${bareSym(key)} · ${STANCES[t.stance].label}`:`${bareSym(key)} · stance cleared`);
}
/* Everything carrying a stance, freshest intent first. */
function stanceBoard(){
  const out=[];
  Object.keys(state.tickerTags).forEach(sym=>{
    const st=stanceFor(sym);
    if(!st)return;
    if(primarySymbol(sym)!==bareSym(sym))return;   // secondaries inherit, don't duplicate
    out.push({symbol:bareSym(sym),stance:st,since:stanceSince(sym),age:stanceAgeDays(sym),stale:stanceIsStale(sym),weight:weightFor(sym,'all'),accountWeights:weightsByAccount(sym)});
  });
  return out.sort((a,b)=>STANCE_ORDER.indexOf(a.stance)-STANCE_ORDER.indexOf(b.stance)||b.weight-a.weight);
}
/* The chip row used on the ticker screen and in the log — the only UI needed
   to maintain a stance. */
function stanceChips(sym,size){
  const cur=stanceFor(sym);
  const sm=size==='sm';
  return `<div style="display:flex;flex-wrap:wrap;gap:4px">`+STANCE_ORDER.map(k=>{
    const on=cur===k;const c=STANCES[k].colour;
    return `<div class="filter-chip" onclick="event.stopPropagation();setStance('${bareSym(sym)}','${k}')"
      style="cursor:pointer;font-size:${sm?'10px':'11px'};padding:${sm?'2px 8px':'3px 10px'};${on?`background:${c};color:#fff;border-color:${c};`:`color:${c};border-color:var(--border2);`}">${on?'✓ ':''}${sm?STANCES[k].short:STANCES[k].label}</div>`;
  }).join('')+`</div>`;
}
function stanceBadge(sym){
  const st=stanceFor(sym);if(!st)return '';
  const c=STANCES[st].colour;
  const stale=stanceIsStale(sym);
  return `<span style="font-family:var(--font-mono);font-size:10px;padding:1px 7px;border-radius:20px;background:${c};color:#fff;white-space:nowrap">${STANCES[st].short}${stale?' ·⏳':''}</span>`;
}

/* The symbol a company is filed under. One hop only, so a chain can't form,
   and a mutual link resolves identically from either side rather than
   ping-ponging. */
function primarySymbol(sym){
  const s=bareSym(sym);
  if(!s)return s;
  const tag=state.tickerTags[s];
  const link=bareSym(tag&&tag.sameAs);
  if(!link||link===s)return s;
  const back=bareSym((state.tickerTags[link]||{}).sameAs);
  if(back===s)return s<link?s:link;    // mutual link — pick deterministically
  return link;
}
function sameCompany(a,b){return primarySymbol(a)===primarySymbol(b);}

/* Every portfolio line belonging to one company — one per listing. Scoped to
   the account in view unless explicitly asked for 'all'. */
function holdingsFor(sym,acct){
  const p=primarySymbol(sym);
  return accountRows(acct===undefined?activeAccount():acct).filter(h=>primarySymbol(h.symbol)===p);
}
/* ══ Accounts ══════════════════════════════════════════════════════════
   Two wrappers with different jobs, so weights are NEVER combined: each is
   a percentage of its own account. A holding that is 3% of Gilgamesh and 1%
   of Odyssey is two separate facts, and mixing them would destroy exactly
   the mental accounting the two accounts exist to keep apart.

   Market value is stored per row and weight derived at read time. That is
   what makes per-account weights possible at all — a stored percentage is
   relative to whatever the account happened to hold on import day, and
   cannot be recomputed. */
/* Display-only masking of cash amounts, for reading the portfolio in public.
   Purely a formatting layer: every calculation still runs on the real numbers,
   so nothing downstream can be affected by whether this is on or off.
   Percentages stay visible — they are the point of the tab and reveal nothing
   about the size of the pot. */
function money(v){
  const n=Math.round(parseFloat(v)||0);
  if(state.hideValues)return '••••';
  return '£'+n.toLocaleString('en-GB');
}
function toggleHideValues(){
  state.hideValues=!state.hideValues;
  save();render();
  showToast(state.hideValues?'Values hidden':'Values shown');
}

function accountLabel(id){const a=ACCOUNTS.find(x=>x.id===id);return a?a.label:id;}
function activeAccount(){
  return ACCOUNTS.some(a=>a.id===state.activeAccount)?state.activeAccount:DEFAULT_ACCOUNT;
}
function setAccount(id){
  if(!ACCOUNTS.some(a=>a.id===id))return;
  state.activeAccount=id;
  state.portSelected={};state.portSelectMode=false;   // selection is per account
  save();render();
}
/* Rows in one account, or every row when passed 'all'. */
function accountRows(acct){
  if(acct==='all')return state.portfolio;
  return state.portfolio.filter(h=>(h.account||DEFAULT_ACCOUNT)===acct);
}
function rowValue(h){return parseFloat(h&&h.mv)||0;}
/* The denominator: what this account actually holds. Derived, never stored,
   so it stays true after any edit or partial re-import. */
function investedFor(acct){
  return accountRows(acct).reduce((t,h)=>t+rowValue(h),0);
}
function metaFor(acct){
  const m=state.portfolioMeta;
  if(!m)return null;
  return m[acct||activeAccount()]||null;
}
function accountIsPopulated(acct){return accountRows(acct).length>0;}
/* Only show the account switcher once there is something to switch to. */
function accountsInUse(){
  const used=ACCOUNTS.filter(a=>accountIsPopulated(a.id));
  return used.length?used:[ACCOUNTS[0]];
}

/* The largest single line, for anything that needs one representative row
   (a company name, a broker label). Never used for weight. */
function holdingFor(sym,acct){
  const l=holdingsFor(sym,acct);
  if(!l.length)return null;
  return l.slice().sort((a2,b2)=>rowValue(b2)-rowValue(a2))[0];
}
/* Weight within ONE account: this company's value across its listings, over
   what that account holds. Two listings of one company combine; two accounts
   never do. */
function weightFor(sym,acct){
  const a=acct===undefined?activeAccount():acct;
  const denom=investedFor(a);
  if(!(denom>0))return 0;
  return holdingsFor(sym,a).reduce((t,h)=>t+rowValue(h),0)/denom;
}
/* Where a company is held, and at what weight in each — for anything that
   needs to show both without implying a combined figure. */
function weightsByAccount(sym){
  return ACCOUNTS
    .filter(a=>holdingsFor(sym,a.id).length)
    .map(a=>({id:a.id,label:a.label,weight:weightFor(sym,a.id)}));
}
/* One entry per company held, with its individual lines kept intact. */
function portfolioGroups(acct){
  const a=acct===undefined?activeAccount():acct;
  const denom=investedFor(a);
  const map={};
  accountRows(a).forEach(h=>{
    const key=primarySymbol(h.symbol);
    if(!map[key])map[key]={key,symbol:key,rows:[],mv:0,weight_pct:0,account:a};
    map[key].rows.push(h);
    map[key].mv+=rowValue(h);
  });
  return Object.values(map).map(g=>{
    g.weight_pct=denom>0?g.mv/denom:0;
    const biggest=g.rows.slice().sort((a2,b2)=>rowValue(b2)-rowValue(a2))[0];
    g.name=lookupCompanyName(g.key)||biggest.name||'';
    g.multi=g.rows.length>1;
    /* What is actually held, spelled out. If every line carries the filing
       symbol, the venue alone is enough (CA · UK). If the symbols differ, or
       the filing symbol is no longer held at all, show the symbol too — so
       selling one leg can never leave a symbol on screen you don't own. */
    const allSameSym=g.rows.every(r=>bareSym(r.symbol)===g.key);
    g.legs=g.rows
      .slice()
      .sort((a2,b2)=>rowValue(b2)-rowValue(a2))
      .map(r=>allSameSym?(r.listing||'?'):(bareSym(r.symbol)+(r.listing?' '+r.listing:'')));
    return g;
  });
}

/* Older saves stored a frozen weight_pct and no account. Rebuild market value
   from it so weights recompute identically, and file everything under the
   primary account. Ratio-preserving: if the invested total is unknown, any
   consistent basis yields the same percentages. */
function migratePortfolioToAccounts(){
  if(!Array.isArray(state.portfolio))state.portfolio=[];
  // portfolioMeta used to be a single flat object
  if(state.portfolioMeta&&typeof state.portfolioMeta==='object'&&!ACCOUNTS.some(a=>state.portfolioMeta[a.id])){
    if('investedValue' in state.portfolioMeta||'totalValue' in state.portfolioMeta){
      state.portfolioMeta={[DEFAULT_ACCOUNT]:state.portfolioMeta};
    }
  }
  const legacyInvested=(metaFor(DEFAULT_ACCOUNT)||{}).investedValue||0;
  let changed=false;
  state.portfolio.forEach(h=>{
    if(!h.account){h.account=DEFAULT_ACCOUNT;changed=true;}
    if(h.mv===undefined||h.mv===null||!(parseFloat(h.mv)>0)){
      const w=parseFloat(h.weight_pct)||0;
      h.mv=w*(legacyInvested>0?legacyInvested:1000000);
      changed=true;
    }
  });
  return changed;
}

// Open memo from ticker chip in log
function lookupCompanyName(symbol){
  const bare=bareSym(symbol);
  const tag=state.tickerTags[bare]||{};
  if(tag.name)return tag.name;                          // manual override wins
  const prim=primarySymbol(bare);                       // then the linked company's
  if(prim!==bare&&(state.tickerTags[prim]||{}).name)return state.tickerTags[prim].name;
  const h=holdingFor(bare);
  return h?h.name:'';                                    // otherwise from the CSV
}

function openTickerMemo(ticker){
  const t=ticker.startsWith('$')?ticker:'$'+ticker;
  const memo=state.memos.find(m=>sameCompany(m.ticker,t));
  if(memo){setTab('memos',{memoId:memo.id});return;}
  const bare=bareSym(ticker);
  const name=lookupCompanyName(bare);
  const ws=weightsByAccount(bare);
  const tag=state.tickerTags[bare]||{};
  const weightLine=ws.length?`<span style="font-family:var(--font-mono);font-size:12px;color:var(--ink3)">${ws.map(a=>`${(a.weight*100).toFixed(1)}% of ${a.label}`).join(' · ')}</span>`:'';
  const tagLine=[tag.sector,tag.geography].filter(Boolean).join(' · ');
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="modal-title">${bare}</div>
          ${name?`<div style="font-size:13px;color:var(--ink2);margin-top:2px">${name}</div>`:''}
        </div>
        <button class="icon-btn" onclick="closeModal()">✕</button>
      </div>

/* ══════════════════════════════════════
   TICKERS  —  the archive.
   Every ticker ever touched, from any source. Holdings, watchlist,
   and sold positions all keep their history here.
══════════════════════════════════════ */

/* ══ Tidying strays ════════════════════════════════════════════════════
   Two ways a ticker outlives its reason for existing:

   1. An entry's `tickers` list is computed when it is saved and then frozen.
      Edit the text and it is recomputed; never touch the entry again and an
      old mis-parse (the $Meridian → $M phantom, fixed earlier) persists.
   2. A tag record survives its entries on purpose — that is what keeps your
      sector work across re-imports — but one with no entries, no holding,
      no memo and no actual tag content is simply debris.

   Both are reported, never repaired silently. The entry TEXT is the honest
   record; `tickers` is only an index of it, so re-deriving the index changes
   nothing you wrote. Anything carrying real content is left alone. */
function findStrayTickers(){
  const entryFixes=[];
  state.entries.forEach(e=>{
    const stored=[...new Set(e.tickers||[])].sort();
    const derived=extractTickers(e.text||'').sort();
    if(stored.join('|')!==derived.join('|')){
      entryFixes.push({
        id:e.id, ts:e.ts,
        text:(e.text||'').slice(0,90),
        removed:stored.filter(t=>!derived.includes(t)),
        added:derived.filter(t=>!stored.includes(t)),
      });
    }
  });

  // Which symbols would still be referenced after those fixes
  const referenced=new Set();
  state.entries.forEach(e=>{
    const fix=entryFixes.find(f=>f.id===e.id);
    (fix?extractTickers(e.text||''):(e.tickers||[])).forEach(t=>referenced.add(primarySymbol(t)));
  });
  accountRows('all').forEach(h=>referenced.add(primarySymbol(h.symbol)));
  state.memos.forEach(m=>referenced.add(primarySymbol(m.ticker)));
  // A link target is referenced by whatever points at it
  Object.keys(state.tickerTags).forEach(sym=>{
    const link=bareSym((state.tickerTags[sym]||{}).sameAs);
    if(link)referenced.add(link);
  });

  const MEANINGFUL=['sector','geography','stance','sameAs','name','legalName','gfTicker','note'];
  const orphanTags=Object.keys(state.tickerTags).filter(sym=>{
    if(referenced.has(primarySymbol(sym)))return false;
    const t=state.tickerTags[sym]||{};
    return !MEANINGFUL.some(k=>t[k]);   // never discard a tag with content
  });

  return {entryFixes,orphanTags,total:entryFixes.length+orphanTags.length};
}

function openTidyModal(){

  const orphanList=s.orphanTags.length?`

  root.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">

    <div style="font-size:13px;color:var(--ink2);line-height:1.7;margin-bottom:12px">
      Your entry text is never changed — only the ticker index derived from it, and tag records holding nothing.
    </div>
    ${entryList}${orphanList}
    <div style="font-size:11px;font-family:var(--font-mono);color:var(--ink3);line-height:1.6;margin-bottom:6px">
      Anything with a sector, stance, link, memo or holding is left alone.
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="applyTidy()">Tidy ${s.total}</button>
    </div>
  </div></div>`;
}

function applyTidy(){
  const s=findStrayTickers();
  if(!s.total){closeModal();return;}
  s.entryFixes.forEach(f=>{
    const e=state.entries.find(x=>x.id===f.id);
    if(e)e.tickers=extractTickers(e.text||'');   // text untouched; index re-derived
  });
  s.orphanTags.forEach(sym=>{ delete state.tickerTags[sym]; });
  save();closeModal();render();markDirty();
  showToast(`Tidied ${s.total} — ${s.entryFixes.length} entries, ${s.orphanTags.length} tag records`);
}

// Everything known about every ticker, from every source
function tickerArchive(){
  const map={};
  // Everything files under the company's primary symbol, so two listings and
  // two symbols for one company converge on a single archive row.
  const touch=(sym)=>{
    const s=primarySymbol(sym);
    if(!map[s])map[s]={symbol:s,entries:[],holding:null,holdings:[],memo:null};
    return map[s];
  };

  state.entries.forEach(e=>{
    e.tickers.forEach(t=>{ touch(t).entries.push(e); });
  });
  accountRows('all').forEach(h=>{ const t=touch(h.symbol); t.holdings.push(h); });
  state.memos.forEach(m=>{ touch(m.ticker).memo=m; });
  Object.keys(state.tickerTags).forEach(s=>{ touch(s); });

  return Object.values(map).map(t=>{
    const tag=state.tickerTags[t.symbol]||{};
    t.entries.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
    t.name      = tag.name||tag.legalName||(t.holding?t.holding.name:'')||'';
    t.sector    = tag.sector||'';
    t.geography = tag.geography||'';
    t.holdings.sort((a,b)=>rowValue(b)-rowValue(a));
    t.holding   = t.holdings[0]||null;
    /* Weights stay per account — never summed. `weight` is this company's
       weight in the account currently in view (or its largest, if it isn't
       held there), used only for sorting and the list pill. */
    t.accountWeights = weightsByAccount(t.symbol);
    t.weight = weightFor(t.symbol,activeAccount())
      || (t.accountWeights.length?Math.max(...t.accountWeights.map(a=>a.weight)):0);
    const grp=portfolioGroups(activeAccount()).find(g=>g.key===t.symbol)
      ||portfolioGroups(t.accountWeights[0]?t.accountWeights[0].id:activeAccount()).find(g=>g.key===t.symbol);
    t.legs = (grp&&grp.rows.length>1)?grp.legs:[];
    t.lastTouch = t.entries.length?new Date(t.entries[0].ts).getTime():0;
    // held now / watched (logged, never held) / closed (has history, not held now)
    t.stance    = stanceFor(t.symbol);
    t.stanceStale = stanceIsStale(t.symbol);
    t.status = t.holding ? 'held' : (t.entries.length||t.memo ? 'closed' : 'watched');
    // "closed" only makes sense if there IS history; otherwise it's just a tag with nothing behind it
    if(!t.holding && !t.entries.length && !t.memo) t.status='watched';
    return t;
  });
}

const TICKER_FILTERS={
  all:    {label:'All',       test:()=>true},
  research:{label:'Research',  test:t=>t.stance==='research'},
  buy:    {label:'Want to buy',test:t=>t.stance==='buy'},
  trim:   {label:'Trim',      test:t=>t.stance==='trim'},
  sell:   {label:'Look to sell',test:t=>t.stance==='sell'},
  watch:  {label:'Watching',  test:t=>t.stance==='watch'},
  stale:  {label:'Stale stance',test:t=>t.stanceStale},
  held:   {label:'Held',      test:t=>!!t.holding},
  closed: {label:'Not held',  test:t=>!t.holding&&(t.entries.length||t.memo)},
  memo:   {label:'Has memo',  test:t=>!!t.memo},
  nomemo: {label:'No memo',   test:t=>!t.memo&&(t.entries.length||t.holding)},
};
const TICKER_SORTS={
  recent: {label:'Recent',  cmp:(a,b)=>b.lastTouch-a.lastTouch},
  stance: {label:'Stance',  cmp:(a,b)=>{
    const ai=a.stance?STANCE_ORDER.indexOf(a.stance):99, bi=b.stance?STANCE_ORDER.indexOf(b.stance):99;
    return ai-bi||b.weight-a.weight;
  }},
  weight: {label:'Weight',  cmp:(a,b)=>(b.weight-a.weight)||(b.entries.length-a.entries.length)},
  logs:   {label:'Logs',    cmp:(a,b)=>b.entries.length-a.entries.length},
  az:     {label:'A–Z',     cmp:(a,b)=>a.symbol.localeCompare(b.symbol)},
};
function setTickerFilter(f){state.tickerFilter=f;save();render();}
function setTickerSort(s){state.tickerSort=s;save();render();}
function openTicker(sym){state.activeTicker=primarySymbol(sym);render();}

}
